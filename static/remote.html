/* ---------- poster card (skeleton -> img | titled fallback) ---------- */
function posterCard({poster,title,year,cta,onPlay,sources,onMarkWatched,rtTitle,detailLine,seLabel,epName,airsNote,followBtn,airInfo,justAired,clickPlays,packCount}){
  const c=el("div",{className:"card"});
  const p=el("div",{className:"poster"});
  const sh=el("div",{className:"shimmer"});
  p.appendChild(sh);
  if(poster){
    const img=el("img",{loading:"lazy",decoding:"async",alt:title||""});
    img.onload=()=>{img.classList.add("in");sh.remove();};
    img.onerror=()=>{sh.remove();p.appendChild(el("div",{className:"fallback",textContent:title||"Untitled"}));};
    img.src=posterSrc(poster); p.appendChild(img);
  }else{
    sh.remove(); p.appendChild(el("div",{className:"fallback",textContent:title||"Untitled"}));
  }
  c.appendChild(p);
  // Content wrapper: on the desktop search "detail" layout the card is a
  // 2-cell grid (poster | body); grouping the text/play/sources into one body
  // cell stops the tall poster from stretching per-row heights (title↔play gap).
  const body=el("div",{className:"body"}); c.appendChild(body);
  const m=el("div",{className:"meta"});
  const tEl=el("div",{className:"t",textContent:title||"Untitled"});
  if(seLabel) tEl.appendChild(el("span",{className:"se",textContent:seLabel}));
  m.appendChild(tEl);
  if(year) m.appendChild(el("div",{className:"y",textContent:year}));
  if(packCount) m.appendChild(el("div",{className:"packn",textContent:`${packCount} episodes`}));
  if(epName) m.appendChild(el("div",{className:"epname",textContent:epName}));
  if(airInfo) m.appendChild(el("div",{className:"airinfo",textContent:airInfo}));
  body.appendChild(m);
  // metadata detail line (year-range · genres · runtime · rating), below the
  // title + above the buttons — filled async by the caller (fillDetailLine).
  if(detailLine){ body.appendChild(el("div",{className:"dline"})); }
  // Button row: Play + Mark-watched, with the RT link a compact tomato pushed
  // to the right. "More sources" stays BELOW this row (appended after).
  const actions=el("div",{className:"actions"});
  if(airsNote){ actions.appendChild(el("span",{className:"airs",textContent:airsNote})); }
  // `clickPlays` (Library): the CARD is the play control, so the redundant ▶ is
  // dropped — a grid of posters where each poster is the target reads better than
  // a grid of posters each wearing a small button. The hover gleam already marks
  // the whole card as live, so the affordance is not lost. Opt-in, because the
  // SEARCH card shares this builder and needs its ▶ alongside Mark-watched /
  // Follow / RT. 2026-08-26.
  if(onPlay && clickPlays){
    c.classList.add("cardplay");
    c.setAttribute("role","button");
    c.tabIndex=0;
    c.setAttribute("aria-label",(cta||"Play")+(title?" "+title:""));
    c.title=(cta||"Play")+(title?" "+title:"");
    c.onclick=()=>onPlay();
    // Keyboard parity — a div with role=button is not natively operable.
    c.onkeydown=(ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); onPlay(); } };
  }else if(onPlay){
    const b=el("button",{className:"play playicon"});
    b.innerHTML=ic("play"); b.setAttribute("aria-label",cta||"Play"); b.title=cta||"Play";
    b.onclick=()=>onPlay(); actions.appendChild(b);
  }
  if(onMarkWatched){
    const w=el("button",{className:"markw",textContent:"✓ Mark watched"});
    w.onclick=async()=>{ if(w.classList.contains("done")) return; w.disabled=true;
      const ok=await onMarkWatched();
      if(ok!==false){ w.textContent="✓ Watched"; w.classList.add("done"); } else { w.disabled=false; } };
    actions.appendChild(w);
  }
  if(followBtn){
    const fb=el("button",{className:"followbtn"+(followBtn.followed?" on":""),textContent:followBtn.followed?"✓ Following":"+ Follow"});
    fb.onclick=async()=>{ fb.disabled=true; const ok=await followBtn.onToggle(); if(ok===false) fb.disabled=false; };
    actions.appendChild(fb);
  }
  if(rtTitle){
    const rt=el("a",{className:"rtlink",textContent:"🍅 →",title:"Open on Rotten Tomatoes",
      href:"https://www.rottentomatoes.com/search?search="+encodeURIComponent(rtTitle),
      target:"_blank",rel:"noopener"});
    actions.appendChild(rt);
  }
  if(actions.children.length) body.appendChild(actions);
  if(sources&&sources.length){
    const anyPartial=sources.some(s=>typeof s.partial_pct==="number");
    const collapsed=()=>`More sources (${sources.length})`+(anyPartial?" · ↓ resume available":"");
    const tg=el("button",{className:"src-toggle"+(anyPartial?" has-partial":""),textContent:collapsed()});
    const box=el("div",{className:"sources"});
    sources.forEach(r=>{
      const part=typeof r.partial_pct==="number";
      const sc=r.seeds??0;
      // seed health — mirrors the green "on disk" pattern. On-disk sources are
      // never "dead" (they play from the local file regardless of swarm). A
      // just-aired episode's swarm is still forming, so a low/0 count is unreliable
      // → mark "🌱 new" (neutral), not red-dead, so a fresh episode isn't scared off.
      const fresh=justAired&&!part&&sc<20;
      const health=part?"ok":fresh?"fresh":(sc<5?"dead":sc<20?"low":"ok");
      const row=el("button",{className:"src"+(part?" partial":health==="dead"?" dead":"")});
      row.appendChild(el("span",{className:"q",textContent:r.quality||"?"}));
      if(part) row.appendChild(el("span",{className:"dl",textContent:r.partial_pct>=100?"✓ on disk":`↓ ${r.partial_pct}%`}));
      row.appendChild(el("span",{className:"x",textContent:codec(r.title)}));
      row.appendChild(el("span",{className:"x",textContent:r.size||""}));
      row.appendChild(el("span",{className:"x",textContent:r.source||""}));
      row.appendChild(el("span",{className:"s "+health,
        title:fresh?"just aired — seed counts unreliable for a day or so; tap to try (spela verifies real delivery)":"",
        textContent:fresh?"🌱 new":(health==="dead"?"⚠ ":"")+sc+"🌱"}));
      row.onclick=()=>doPlay({result_id:r.id});
      box.appendChild(row);
    });
    tg.onclick=()=>{box.classList.toggle("open");
      tg.textContent=(box.classList.contains("open")?"Hide sources":collapsed());};
    body.append(tg,box);
    c._openSources=()=>{box.classList.add("open");tg.textContent="Hide sources";};
  }
  return c;
}
const codec=t=>/(\bx265\b|\bh\.?\s?265\b|hevc)/i.test(t||"")?"HEVC"
  :/(\bx264\b|\bh\.?\s?264\b|avc)/i.test(t||"")?"H.264":"—";

// "Continue watching" row — spela-native tracker, slice 1. Shows the distinct
// titles played in spela over the last 14 days (from /recent); tap a chip to
// jump straight to that show's sources. Hides when there's no recent history.
async function loadRecent(){
  const row=$("#recentRow"); if(!row) return;
  let d; try{ d=await api("/recent"); }catch(e){ return; }
  const items=(d&&d.recent)||[];
  if(!items.length){ row.classList.remove("on"); row.innerHTML=""; return; }
  row.innerHTML=""; row.appendChild(el("div",{className:"rlab",textContent:"Recently watched"}));
  const chips=el("div",{className:"chips"});
  items.forEach(it=>{
    const c=el("button",{className:"chip"});
    c.innerHTML=esc(it.label)+(it.season?`<span class="ep">S${String(it.season).padStart(2,"0")}E${String(it.episode||0).padStart(2,"0")}</span>`:"");
    c.onclick=()=>{ setMode(it.season?"tv":"movie");
      $("#q").value=it.query; S.search.q=it.query; runSearch(it.query); };
    chips.appendChild(c);
  });
  row.appendChild(chips); row.classList.add("on");

// "2026-07-26" → "Jul 26" (+ ", YYYY" when not the current year). For followed rows.
function fmtDate(iso){ if(!iso) return ""; const p=String(iso).split("-").map(Number);
  if(p.length<3||!p[1]) return String(iso);
  const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][p[1]-1];
  const yr=(p[0]===new Date().getFullYear())?"":(", "+p[0]);
  return mo+" "+p[2]+yr; }

// "Latest S03E06 · aired Jul 26 · next S03E07 Aug 2" from show.latest_episode +
// next_episode — shown on the search card so you see how current the show is,
// regardless of which episode the query resolved to. TV only (movies → undefined).
// `searched` = d.searching (the episode the query resolved to). TMDB's latest_episode
// LAGS the real platform release (Star Trek S04E03 was out while TMDB still said the
// latest was E02 — the "which ep is actually latest?" confusion, 2026-08-06). So when
// the searched episode is >= TMDB's latest, TMDB's "Latest" is stale + contradicts the
// card header → drop the "Latest" clause (the header already shows the newer episode);
// keep only a genuinely-future "next" hint.
function latestAirLine(show, searched){
  if(!show || show.seasons==null) return undefined;
  const le=show.latest_episode; if(!le) return undefined;
  const se=(s,e)=>"S"+String(s).padStart(2,"0")+"E"+String(e).padStart(2,"0");
  const ne=show.next_episode, t=new Date().toISOString().slice(0,10);
  const nextClause=(ne && ne.air_date && ne.air_date>t)?"next "+se(ne.season,ne.episode)+" "+fmtDate(ne.air_date):"";
  const searchedNewer = searched && searched.season!=null && searched.episode!=null &&
    (searched.season>le.season || (searched.season===le.season && searched.episode>=le.episode));
  if(searchedNewer) return nextClause||undefined;   // TMDB "latest" is stale — don't contradict the header
  let s="Latest "+se(le.season,le.episode)+(le.air_date?" · aired "+fmtDate(le.air_date):"");
  if(nextClause) s+=" · "+nextClause;
  return s;
}

// New episodes of followed series (slice 2b). GET /following joins the follow-list
// with TMDB air-dates + the watched_through baseline. Renders shows that have
// unwatched-aired episodes as a landing row (tap → search that next episode) with a
// ✓ to mark it watched (for a view on a phone / friend's TV that spela can't see),
// and a subtle header count badge. Marking sets watched_through to EXACTLY that
// episode — the next one stays new.
// One followed-show row (.foitem): poster-bg tap-to-play + a ✓ mark. `onMarked`
// runs after a successful mark so the caller can refresh whichever view it's in.
function followingItem(s, onMarked){
  const item=el("div",{className:"foitem"});
  const nu=s.next_unwatched||"";
  const tap=el("button",{className:"fotap"});
  const epName=s.next_unwatched_name?` · ${esc(s.next_unwatched_name)}`:"";
  const airedNu=s.next_unwatched_air?`aired ${fmtDate(s.next_unwatched_air)}`:"";
  const nextUp=s.next_air?`next ${esc(s.next_air.se)} · ${fmtDate(s.next_air.air_date)}`:"";
  const line2=[airedNu,nextUp].filter(Boolean).join("  ·  ");
  tap.innerHTML=`<span class="fotitle">${esc(s.title)}</span>`
    +`<span class="fometa"><b>${s.new_count} new</b>${nu?` · ${esc(nu)}`:""}${epName}</span>`
    +(line2?`<span class="fosub">${line2}</span>`:"")
    +(s.partway!=null?`<span class="fosub partway">▸ ${s.partway}% into ${esc(nu||"this episode")}</span><span class="cprog"><span class="cprogfill" style="width:${s.partway}%"></span></span>`:"");
  tap.onclick=()=>{ setMode("tv"); const q=s.title+(nu?" "+nu:""); $("#q").value=q; S.search.q=q; location.hash="#/search"; runSearch(q); };
  // Poster as a half-faded background — same treatment as the To-Watch rows.
  // Prefer the landscape backdrop (crisp in the wide row); fall back to the
  // portrait poster (which `cover` upscales ~3-4x → fuzzy). 2026-08-06.
  const bg=s.backdrop_url||s.poster_url;
  if(bg){ const ps=posterSrc(bg); const img=new Image();
    img.onload=()=>{ tap.style.backgroundImage=`linear-gradient(90deg,rgba(15,15,20,.9),rgba(15,15,20,.66)),url('${ps}')`;
      tap.style.backgroundSize="cover"; tap.style.backgroundPosition="center 30%"; };
    img.src=ps; }
  item.appendChild(tap);
  // Fast-play ▶ — play the next unwatched episode's best source directly.
  { const pb=el("button",{className:"foplay"}); pb.innerHTML=ic("play");
    pb.title="Play "+(nu||s.title); pb.setAttribute("aria-label","Play "+(nu||s.title));
    pb.onclick=(ev)=>{ ev.stopPropagation(); fastPlay((s.title+(nu?" "+nu:"")).trim(), true, s.poster_url); };
    item.appendChild(pb); }
  if(s.next_unwatched_season!=null){
    const mk=el("button",{className:"fomark",textContent:"✓",title:"Mark "+nu+" watched"});
    mk.setAttribute("aria-label","Mark "+nu+" watched");
    mk.onclick=async(ev)=>{ ev.stopPropagation(); mk.disabled=true;
      let r; try{ r=await api("/following/mark",{method:"POST",body:{tmdb_id:s.tmdb_id,season:s.next_unwatched_season,episode:s.next_unwatched_episode}}); }
      catch{ mk.disabled=false; toast("Couldn’t mark watched"); return; }
      if(!r||!r.ok){ mk.disabled=false; toast("Couldn’t mark watched"); return; }
      if(onMarked) onMarked(); };
    item.appendChild(mk);
  }
  // Unfollow ✕ — membership only; the ledger keeps progress, so re-following later
  // resumes where he left off.
  const uf=el("button",{className:"founfollow",textContent:"✕",title:"Unfollow "+s.title});
  uf.setAttribute("aria-label","Unfollow "+s.title);
  uf.onclick=async(ev)=>{ ev.stopPropagation(); uf.disabled=true;
    let r; try{ r=await api("/following/remove",{method:"POST",body:{tmdb_id:s.tmdb_id}}); }
    catch{ uf.disabled=false; toast("Couldn’t unfollow"); return; }
    if(!r||!r.ok){ uf.disabled=false; toast("Couldn’t unfollow"); return; }
    if(S.followedIds) S.followedIds.delete(s.tmdb_id);
    toast("Unfollowed");
    if(onMarked) onMarked(); };
  item.appendChild(uf);
  // Per-season "seen" overlay: an expander (☰) revealing S1..SN toggle chips, so a
  // non-linear history (saw S2-5 but not S1) can be recorded → the New-Episodes
  // count drops to only genuinely-unseen episodes. Count refreshes on panel close.
  if(Array.isArray(s.season_numbers) && s.season_numbers.length){
    const wrap=el("div",{className:"fowrap"});
    const exp=el("button",{className:"foseasonbtn",textContent:"☰",title:"Mark seasons already seen"});
    exp.setAttribute("aria-label","Mark seasons of "+s.title+" already seen");
    const panel=el("div",{className:"foseasons"});
    exp.onclick=(ev)=>{ ev.stopPropagation();
      const opening=!panel.classList.contains("on");
      panel.classList.toggle("on");
      if(opening && !panel.childElementCount) buildSeasonChips(panel,s);
      if(!opening && onMarked) onMarked(); };
    item.appendChild(exp);
    wrap.appendChild(item); wrap.appendChild(panel);
    return wrap;
  }
  return item;
}

// Season toggle chips for the seen-seasons overlay. Each chip POSTs the full
// checked set (replace semantics); the New-Episodes count refreshes when the panel
// is closed (see the expander handler) so a burst of toggles is one recompute.
function buildSeasonChips(panel, s){
  const seen=new Set(s.seen_seasons||[]);
  panel.appendChild(el("div",{className:"foseaslab",textContent:"I've already seen these seasons:"}));
  const row=el("div",{className:"foseaschips"});
  s.season_numbers.forEach(n=>{
    const c=el("button",{className:"foseaschip"+(seen.has(n)?" on":""),textContent:"S"+n});
    c.setAttribute("aria-pressed",seen.has(n)?"true":"false");
    c.onclick=async(ev)=>{ ev.stopPropagation();
      const now=!seen.has(n); if(now) seen.add(n); else seen.delete(n);
      c.classList.toggle("on",now); c.setAttribute("aria-pressed",now?"true":"false");
      try{ const r=await api("/following/seen-seasons",{method:"POST",body:{tmdb_id:s.tmdb_id,seasons:[...seen]}});
        if(!r||!r.ok) toast("Couldn’t save"); }
      catch{ toast("spela unreachable"); } };
    row.appendChild(c);
  });
  panel.appendChild(row);
}

// Fill `container` with the "New episodes" label + rows for shows with new eps.
// Returns how many rows were rendered (0 → container left empty).
function fillFollowing(container, shows, onMarked){
  container.innerHTML="";
  const withNew=(shows||[]).filter(s=>s.new_count>0);
  if(!withNew.length) return 0;
  container.appendChild(el("div",{className:"rlab",textContent:"New episodes"}));
  const list=el("div",{className:"folist"});
  withNew.forEach(s=>list.appendChild(followingItem(s, onMarked)));
  container.appendChild(list);
  return withNew.length;
}

// Coming soon — caught-up followed shows whose next episode airs in the FUTURE
// (new_count==0, so New Episodes can't show them; e.g. Silo waiting on tomorrow's ep).
// No play/mark (the episode isn't out yet); tap searches the show.
function fmtRelDate(d){
  if(!d) return "";
  const t=new Date(d+"T00:00:00"); const now=new Date(); now.setHours(0,0,0,0);
  const days=Math.round((t-now)/86400000);
  if(days<=0) return fmtDate(d);
  if(days===1) return "tomorrow";
  if(days<7) return "in "+days+" days";
  return fmtDate(d);
}
function upcomingItem(s){
  const item=el("div",{className:"foitem"});
  const tap=el("button",{className:"fotap"});
  const se=s.next_air?esc(s.next_air.se):"";
  const when=s.next_air?fmtRelDate(s.next_air.air_date):"";
  tap.innerHTML=`<span class="fotitle">${esc(s.title)}</span>`
    +`<span class="fometa">${se?se+" · ":""}airs <b>${when}</b></span>`;
  // Tap → search the SPECIFIC upcoming episode (e.g. "Silo S03E06"), NOT just the show
  // (which defaults to S01E01). TV mode sends no movie param, so the show resolves right;
  // spela parses the SxxExx and lands on that episode (0 sources until it releases).
  tap.onclick=()=>{ setMode("tv"); const q=s.title+(s.next_air&&s.next_air.se?" "+s.next_air.se:"");
    $("#q").value=q; S.search.q=q; location.hash="#/search"; runSearch(q); };
  // Prefer the landscape backdrop (crisp in the wide row); fall back to the
  // portrait poster (which `cover` upscales ~3-4x → fuzzy). 2026-08-06.
  const bg=s.backdrop_url||s.poster_url;
  if(bg){ const ps=posterSrc(bg); const img=new Image();
    img.onload=()=>{ tap.style.backgroundImage=`linear-gradient(90deg,rgba(15,15,20,.9),rgba(15,15,20,.66)),url('${ps}')`;
      tap.style.backgroundSize="cover"; tap.style.backgroundPosition="center 30%"; };
    img.src=ps; }
  item.appendChild(tap); return item;
}
function fillUpcoming(container, shows){
  if(!container) return 0;
  container.innerHTML="";
  const up=(shows||[]);
  if(!up.length){ container.classList.remove("on"); return 0; }
  container.appendChild(el("div",{className:"rlab",textContent:"Coming soon"}));
  const list=el("div",{className:"folist"});
  up.forEach(s=>list.appendChild(upcomingItem(s)));
  container.appendChild(list); container.classList.add("on");
  return up.length;
}

// Refresh the section wherever it's shown (search landing row + header badge, and
// the To-Watch view if that's current).
function refreshFollowing(){ loadFollowing(); if(currentView()==="towatch") renderToWatch(); }

async function loadFollowing(){
  const row=$("#followingRow"), badge=$("#newEpBadge");
  let d; try{ d=await api("/following"); }catch(e){ return; }
  const shows=(d&&d.shows)||[], totalNew=(d&&d.total_new)||0;
  S.followedIds=new Set(shows.map(s=>s.tmdb_id));
  if(badge){ if(totalNew>0){ badge.textContent="▶ "+totalNew+" new"; badge.hidden=false; } else badge.hidden=true; }
  if(!row) return;
  const n=fillFollowing(row, shows, refreshFollowing);
  row.classList.toggle("on", n>0);
}

// ── Unified home screen (slice 7) ──────────────────────────────────────────
// The landing "what do I watch now" queue, from GET /home: Continue (in-progress)
// → New Episodes (followed) → Recommended (Claude-harness-curated, each with a
// one-line "why"). Search is one tap away. Sections hide when empty.
async function loadHome(){
  loadPending();                       // "watched on a TV?" confirm prompt (lives on home)
  let d; try{ d=await api("/home"); }
  catch(e){ const em=$("#homeEmpty"); if(em) em.innerHTML=`<div class="state"><div class="big">spela unreachable</div></div>`; return; }
  const badge=$("#newEpBadge"), tn=(d&&d.total_new)||0;
  if(badge){ if(tn>0){ badge.textContent="▶ "+tn+" new"; badge.hidden=false; } else badge.hidden=true; }
  fillContinue($("#continueRow"), (d&&d.continue)||[]);
  const fr=$("#homeFollowingRow");
  if(fr){ const n=fillFollowing(fr,(d&&d.new_episodes)||[],loadHome); fr.classList.toggle("on",n>0); }
  fillUpcoming($("#homeUpcomingRow"), (d&&d.upcoming)||[]);
  const em=$("#homeEmpty");
  if(em){ const any=(d&&((d.continue||[]).length||(d.new_episodes||[]).length||(d.upcoming||[]).length));
    em.innerHTML=any?"":`<div class="state"><div class="big">Nothing queued yet</div><div>Search for something, or follow a show.</div></div>`; }
}

// Continue — in-progress plays (resume). Poster-bg row + progress bar; tap →
// search that title/episode (the play auto-resumes from the saved position).
function fillContinue(container, items){
  if(!container) return; container.innerHTML="";
  if(!items.length){ container.classList.remove("on"); return; }
  container.appendChild(el("div",{className:"rlab",textContent:"Continue"}));
  const list=el("div",{className:"folist"});
  items.forEach(it=>list.appendChild(continueItem(it)));
  container.appendChild(list); container.classList.add("on");
}
function continueItem(it){
  const item=el("div",{className:"foitem"});
  const tap=el("button",{className:"fotap"});
  // isTV from the struct fields OR the title's SxxExx — a legacy in-progress entry
  // (pre the season/episode source-fix) has null fields but "Show SxxExx" in the
  // title, and without this the tap searched in Movies mode → "No playable sources".
  const isTV=(it.season!=null&&it.episode!=null)||/S\d{1,2}E\d{1,3}/i.test(it.title||"");
  const se=(it.season!=null&&it.episode!=null)?`S${String(it.season).padStart(2,"0")}E${String(it.episode).padStart(2,"0")}`:"";
  const name=it.show||it.title||"";
  const meta=(it.pct!=null)?`${it.pct}% watched`:"Resume";
  tap.innerHTML=`<span class="fotitle">${esc(name)}${se?`<span class="ep">${se}</span>`:""}</span>`
    +`<span class="fometa">${meta}</span>`
    +(it.pct!=null?`<span class="cprog"><span class="cprogfill" style="width:${it.pct}%"></span></span>`:"");
  tap.onclick=()=>{ setMode(isTV?"tv":"movie");
    const q=(name+(se?" "+se:"")).trim(); $("#q").value=q; S.search.q=q;
    location.hash="#/search"; runSearch(q); };
  paintPoster(tap,it.poster_url); lazyBackdrop(tap, name, isTV);
  item.appendChild(tap);
  // Fast-play ▶ — resume the best source directly (skips the search step).
  const pb=el("button",{className:"foplay"}); pb.innerHTML=ic("play");
  pb.title="Play "+name; pb.setAttribute("aria-label","Play "+name);
  pb.onclick=(ev)=>{ ev.stopPropagation(); fastPlay((name+(se?" "+se:"")).trim(), isTV, it.poster_url); };
  item.appendChild(pb);
  // Dismiss ✕ — drop a stray / mislabelled watch from Continue (→ /continue/remove).
  if(it.key){
    const dm=el("button",{className:"fomark",textContent:"✕",title:"Remove from Continue"});
    dm.setAttribute("aria-label","Remove "+name+" from Continue");
    dm.onclick=async(ev)=>{ ev.stopPropagation(); dm.disabled=true;
      const r=await api("/continue/remove",{method:"POST",body:{key:it.key}}).catch(()=>null);
      if(r&&r.ok) item.remove(); else dm.disabled=false; };
    item.appendChild(dm);
  }
  return item;
}

// Recommended — harness-curated picks. The "why" line is the value. Tap → search.
function fillRecommended(container, items){
  if(!container) return; container.innerHTML="";
  if(!items.length){ container.classList.remove("on"); return; }
  container.appendChild(el("div",{className:"rlab",textContent:"Recommended for you"}));
  const list=el("div",{className:"folist"});
  items.forEach(it=>list.appendChild(recItem(it)));
  container.appendChild(list); container.classList.add("on");
}
function recItem(it){
  const item=el("div",{className:"foitem"});
  const tap=el("button",{className:"fotap"});
  const isTV=it.media_type==="tv";
  const yr=it.year?`<span class="ep">${it.year}</span>`:"";
  const rtInit=(it.rt_score!=null)?" · 🍅 "+it.rt_score:"";
  tap.innerHTML=`<span class="fotitle">${esc(it.title)}${yr}</span>`
    +(it.why?`<span class="fosub">${esc(it.why)}</span>`:"")
    +`<span class="fometa">${isTV?"Series":"Movie"}<span class="rrt">${rtInit}</span></span>`;
  tap.onclick=()=>{ setMode(isTV?"tv":"movie");
    const q=searchQueryFor(it);
    $("#q").value=q; S.search.q=q; location.hash="#/search"; runSearch(q); };
  if(it.poster_url) paintPoster(tap,it.poster_url);
  enrichWhenVisible(tap,()=>enrichRec(tap,it));
  item.appendChild(tap);
  // Quick "I've already seen this" ✓ — marks watched (→ ledger, dropped from recs
  // next load) WITHOUT clicking into the title. Optimistically removes the row.
  const mk=el("button",{className:"fomark",textContent:"✓",title:"I've already seen "+it.title});
  mk.setAttribute("aria-label","Mark "+it.title+" already watched");
  mk.onclick=async(ev)=>{ ev.stopPropagation(); mk.disabled=true;
    if(!await markWatched(it.title, it.imdb_id||"")){ mk.disabled=false; return; }
    // Remember where the row sat so Undo puts it back in place, not at the end.
    const parent=item.parentNode, next=item.nextSibling;
    item.remove();
    toastAction("Marked watched","Undo",async()=>{
      if(!await unmarkWatched(it.title)) return;
      if(parent) parent.insertBefore(item,next);
      mk.disabled=false; toast("Undone");
    });
  };
  item.appendChild(mk);
  return item;
}

// Lazy enrich a recommendation row via /title-meta — the same server-cached
// lookup To-Watch uses: paints the poster-bg, appends the year, and OVERRIDES the
// curated 🍅 with the LIVE MDBList score so Home matches the search card + To-Watch
// (a curated score can be months stale; live is the truth spela shows elsewhere).
async function enrichRec(tap, it){
  const isTV=it.media_type==="tv";
  let m; try{ m=await api(titleMetaQS(it,isTV)); }catch{ return; }
  if(!m) return;
  if(m.poster_url||m.backdrop_url) paintPoster(tap, m.poster_url, m.backdrop_url);
  if(m.year){ const t=tap.querySelector(".fotitle"); if(t && !t.querySelector(".ep")) t.appendChild(el("span",{className:"ep",textContent:String(m.year)})); }
  if(m.rt!=null){ const r=tap.querySelector(".rrt"); if(r) r.textContent=" · 🍅 "+m.rt; }
}

// Shared faded-background for wide rows. Prefers the landscape backdrop (crisp);
// falls back to the portrait poster (which `cover` upscales ~3-4x → fuzzy).
function paintPoster(tap, poster, backdrop){
  const src=backdrop||poster; if(!src) return; const ps=posterSrc(src); const img=new Image();
  img.onload=()=>{ tap.style.backgroundImage=`linear-gradient(90deg,rgba(15,15,20,.9),rgba(15,15,20,.66)),url('${ps}')`;
    tap.style.backgroundSize="cover"; tap.style.backgroundPosition=backdrop?"center 30%":"center 20%"; };
  img.src=ps;
}
// Lazy landscape backdrop for a title-only row (Continue rail) — the same
// server-cached /title-meta lookup To-Watch + Recommended use. Poster paints
// instantly; this upgrades it to the sharp backdrop when it resolves. 2026-08-06.
async function lazyBackdrop(tap, title, isTV){
  if(!title) return;
  try{ const m=await api("/title-meta?title="+encodeURIComponent(title)+(isTV?"&tv=1":""));
    if(m&&m.backdrop_url) paintPoster(tap, m.poster_url, m.backdrop_url); }catch{}
}

// Chromecast auto-track confirm prompt (slice 5). The tracker detects
// near-complete sessions on the house TVs, but housemates watch those too — so
// nothing enters Fredrik's watched-ledger without a "Yes". Surfaced on the
// search/landing view; each item gets Yes (→ mark watched) / No (→ dismiss,
// won't re-nag that episode).
async function loadPending(){
  const row=$("#pendingRow"); if(!row) return;
  let d; try{ d=await api("/pending-watched"); }catch(e){ return; }
  const items=(d&&d.pending)||[];
  if(!items.length){ row.classList.remove("on"); row.innerHTML=""; return; }
  row.innerHTML=""; row.appendChild(el("div",{className:"rlab",textContent:"Watched on a TV? Confirm to track"}));
  items.forEach(it=>{
    const card=el("div",{className:"pconf"});
    const t=el("div",{className:"pt"});
    t.appendChild(el("div",{className:"a",textContent:it.title}));
    t.appendChild(el("div",{className:"b",textContent:"on "+(it.device||"a TV")}));
    card.appendChild(t);
    const pb=el("div",{className:"pb"});
    const yes=el("button",{className:"yes",textContent:"Yes"});
    const no=el("button",{className:"no",textContent:"No"});
    yes.onclick=()=>resolvePending(it.key,true,card);
    no.onclick=()=>resolvePending(it.key,false,card);
    pb.append(yes,no); card.appendChild(pb);
    row.appendChild(card);
  });
  row.classList.add("on");
}
async function resolvePending(key,watched,card){
  card.style.opacity=".4";
  try{ await api("/pending-watched/resolve",{method:"POST",body:{key,watched}}); }
  catch{ card.style.opacity="1"; toast("spela unreachable"); return; }
  card.remove();
  const row=$("#pendingRow");
  if(row && !row.querySelector(".pconf")){ row.classList.remove("on"); row.innerHTML=""; }
  toast(watched?"Marked watched":"Dismissed");
}

let dT;
$("#q").addEventListener("input",e=>{ const q=e.target.value.trim();
  clearTimeout(dT); dT=setTimeout(()=>{ S.search.q=q;
    if(q){ runSearch(q); } else { $("#searchOut").innerHTML=""; loadRecent(); loadPending(); loadFollowing(); } },300); });

// Mark the shown movie/series watched (search detail button). Show-level for a
// plain show title; the server keys per-episode if the title carries SxxExx.
async function markWatched(title,imdb){
  try{ const r=await api("/watched-add",{method:"POST",body:{title,imdb_id:imdb||""}});
    if(r&&r.ok){ toast("Marked watched"); return true; } toast("Couldn’t mark watched"); return false; }
  catch{ toast("spela unreachable"); return false; }
}

// Undo a mark-watched — drops every ledger entry for the title (POST
// /watched-remove). The ledger used to be append-only, so a stray ✓ was
// permanent: four minutes of one episode hid a whole series for weeks.
async function unmarkWatched(title){
  try{ const r=await api("/watched-remove",{method:"POST",body:{title}});
    if(r&&r.ok) return true; toast("Couldn’t undo"); return false; }
  catch{ toast("spela unreachable"); return false; }
}

// Fill the search-detail metadata line (year-range · genres · runtime/seasons ·
// TMDB rating) from the cached /title-meta arsenal. TMDB rating (⭐) is shown
// because a real RT score isn't available for arbitrary search results.
// Colour carries the verdict faster than the word does: an ending is the one a viewer
// wants to spot without reading. Undecided is amber because it is genuinely unresolved,
// not bad news.
function statusTone(label){
  if(/cancel/i.test(label)) return "bad";
  if(/^ended/i.test(label)) return "done";
  if(/undecided/i.test(label)) return "warn";
  return "good";
}
function noteAgeDays(iso){
  if(!iso) return null;
  const t=Date.parse(iso); if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/86400000);
}

async function fillDetailLine(card, title, isTV){
  const dl=card.querySelector(".dline"); if(!dl) return;
  let m; try{ m=await api("/title-meta?title="+encodeURIComponent(title)+(isTV?"&tv=1":"")); }catch{ return; }
  if(!m) return;
  const parts=[];
  if(m.year) parts.push(String(m.year));
  if(m.genres&&m.genres.length) parts.push(m.genres.slice(0,3).join(", "));
  if(isTV && m.seasons) parts.push(m.seasons+" season"+(m.seasons>1?"s":""));
  else if(m.runtime) parts.push(m.runtime+" min");
  dl.textContent=parts.join("  ·  ");
  // Status pill sits ON the detail line: "is it coming back" belongs with the year and
  // season count, not in a separate block the eye has to find.
  if(m.status_label){
    const st=el("span",{className:"stpill "+statusTone(m.status_label),textContent:m.status_label});
    dl.append(document.createTextNode(" "), st);
  }
  // The hand-written intel line, underneath. Small and dim: it is commentary, not fact,
  // and it carries its own date once old enough that a reader should discount it.
  if(m.note && !card.querySelector(".shownote")){
    const nl=el("div",{className:"shownote clamped"});
    nl.appendChild(el("span",{textContent:m.note}));
    const age=noteAgeDays(m.note_as_of);
    if(age!=null && age>45){
      nl.appendChild(el("span",{className:"noteage",textContent:" · as of "+m.note_as_of}));
    }
    dl.after(nl);
    // A note that says WHY (why a show was cancelled, who took over and what they
    // changed) is worth more than a bare verdict, but it runs long. Clamp to three
    // lines and let it open, so the extra depth costs nothing when unread. The toggle
    // only appears when the text ACTUALLY overflows — measured after layout, never
    // guessed from length, since wrapping depends on the viewport.
    requestAnimationFrame(()=>{
      if(nl.scrollHeight <= nl.clientHeight + 2){ nl.classList.remove("clamped"); return; }
      const more=el("button",{className:"notemore",textContent:"more"});
      more.onclick=()=>{ const open=nl.classList.toggle("clamped")===false;
        more.textContent=open?"less":"more"; };
      nl.after(more);
    });
  }
  // live RT score (MDBList) → the compact tomato shows the number + links to
  // the real RT page. Without a key m.rt is absent → the tomato stays a search
  // link (unchanged).
  if(m.rt!=null){ const rl=card.querySelector(".rtlink");
    if(rl){ rl.textContent="🍅 "+m.rt+" →"; if(m.rt_url) rl.href=m.rt_url; } }
  // Trailer sits under the actions, above "More sources" — it informs the decision
  // the buttons act on, so it belongs between them, not at the bottom of the card.
  if(m.trailer_key && !card.querySelector(".trwrap")){
    const body=card.querySelector(".body")||card;
    const acts=body.querySelector(".actions");
    const blk=trailerBlock(m.trailer_key,title);
    if(acts&&acts.nextSibling) body.insertBefore(blk,acts.nextSibling); else body.appendChild(blk);
  }
}

async function runSearch(q){
  stopTrailers();                 // a new query replaces the card the trailer sits in
  if(S.search.abort) S.search.abort.abort();
  const ac=new AbortController(); S.search.abort=ac;
  // Viewing a specific title → hide the landing bars (recently-watched +
  // pending-confirm); they return when the search box is cleared.
  $("#recentRow")?.classList.remove("on"); $("#pendingRow")?.classList.remove("on"); $("#followingRow")?.classList.remove("on");
  const out=$("#searchOut");
  // Instant interpretation: mirror the server's SxxExx parse client-side so the
  // "Season N Episode M" tag shows in the loading skeleton BEFORE the /search
  // round-trip returns (server d.searching stays authoritative for the final card).
  const seGuess=seFromQuery(q);
  const tSkel=seGuess?`<span class="se">${seGuess}</span>`:"&nbsp;";
  out.innerHTML=`<div class="detail skeleton"><div class="card"><div class="poster"><div class="shimmer"></div></div><div class="meta"><div class="t">${tSkel}</div></div></div></div>`;
  // Send the toggle in BOTH directions. Sending only &movie=1 left TV mode looking
  // identical to saying nothing, so the server auto-detected and could return a film
  // of the same name (Furious, 2026-08-27).
  let qs="q="+encodeURIComponent(q); qs += (S.mode==="movie") ? "&movie=1" : "&tv=1";
  // Pass the selected target so the server ranks for it: native-HEVC targets
  // (vlc/phone) rank by seeds; NVENC targets (chromecast/shannon) prefer H.264.
  if(S.target&&S.target.kind) qs+="&target="+encodeURIComponent(S.target.kind);
  let d;
  try{ d=await api("/search?"+qs,{signal:ac.signal}); }
  catch(e){ if(e.name==="AbortError")return;
    out.innerHTML=`<div class="state"><div class="big">spela unreachable</div>Check the connection and retry.</div>`; return; }
  S.search.data=d;
  if(d.error){ out.innerHTML=`<div class="state"><div class="big">No match</div>${esc(d.error)}<div style="margin-top:.6rem;font-size:.82rem">Try the Movies / TV toggle above.</div></div>`; return; }
  const res=d.results||[];
  const show=d.show||{}, year=(show.release_date||"").slice(0,4);
  // Server parsed SxxExx out of the query (search.rs parse_episode_markers) and
  // echoes it as d.searching {season, episode, name, air_date}.
  const se=d.searching;
  const seLabel=se?`Season ${se.season} Episode ${se.episode}`:seFromQuery(q);
  const fb=await followBtnFor(show);
  const airInfo=latestAirLine(show, se);
  // Unaired-episode guard: the server skips Torrentio for a future air_date (so
  // `res` is empty by design). Show "Airs <date>" instead of a dead Play + junk
  // sources (the S04E03 "no worky" incident, 2026-08-02).
  const today=new Date().toISOString().slice(0,10);
  if(se && se.air_date && se.air_date>today){
    const grid=el("div",{className:"detail"});
    const card=posterCard({poster:show.poster_url, title:show.title||"", detailLine:true, seLabel,
      epName:se.name, airsNote:"Airs "+fmtDate(se.air_date), followBtn:fb, airInfo});
    grid.appendChild(card); out.innerHTML=""; out.appendChild(grid);
    fillDetailLine(card, show.title||"", true);
    return;
  }
  if(!res.length){ out.innerHTML=`<div class="state"><div class="big">No playable sources</div>Nothing found for “${esc(q)}”. Try the Movies / TV toggle.</div>`; return; }
  const grid=el("div",{className:"detail"});
  const card=posterCard({
    poster:show.poster_url, title:show.title||res[0].title, detailLine:true, seLabel,
    epName: se&&se.name?se.name:undefined,
    cta:"Play best source", sources:res,
    onPlay:()=>doPlay({result_id:res[0].id}, card),
    onMarkWatched:()=>markWatched(show.title||res[0].title, show.imdb_id),
    rtTitle:show.title||res[0].title, followBtn:fb, airInfo,
    // Just-aired episode → its swarm is still forming, so low/0 seed counts are
    // unreliable (2026-08-13: a "0 seeds" S04E04 streamed fine). Mark sources "🌱 new"
    // instead of red-dead so a fresh episode doesn't look falsely dead.
    justAired: !!(se && se.air_date && (()=>{const a=new Date(se.air_date).getTime(); return a<=Date.now() && Date.now()-a < 2.2*864e5;})())
  });
  grid.appendChild(card); out.innerHTML=""; out.appendChild(grid);
  fillDetailLine(card, show.title||res[0].title, S.mode==="tv");
}

// Build a Follow/Unfollow control for a search-result show — TV only (movies have
// no episodes to follow; detected via `show.seasons`). Toggling hits
// /following/add | /following/remove (membership only; progress lives in the
// ledger, so re-following resumes where he left off) then refreshes.
async function followBtnFor(show){
  if(!show || !show.tmdb_id || show.seasons==null) return undefined;
  await ensureFollowedIds();
  const id=show.tmdb_id;
  return {
    followed: S.followedIds.has(id),
    onToggle: async()=>{
      const on=S.followedIds.has(id);
      const r=on
        ? await api("/following/remove",{method:"POST",body:{tmdb_id:id}})
        : await api("/following/add",{method:"POST",body:{tmdb_id:id,imdb_id:show.imdb_id||"",title:show.title||""}});
      if(!r||!r.ok){ toast(on?"Couldn’t unfollow":"Couldn’t follow"); return false; }
      if(on) S.followedIds.delete(id); else S.followedIds.add(id);
      toast(on?"Unfollowed":"Following ✓");
      loadFollowing();
      if(S.search.q) runSearch(S.search.q);   // re-render the button state
      return true;
    }
  };
}
// Followed tmdb_id set — lazily fetched once, kept in sync by add/remove +
// loadFollowing. Lets the search card show Follow vs Unfollow without a per-card
// round-trip.
async function ensureFollowedIds(){
  if(S.followedIds) return;
  try{ const d=await api("/following"); S.followedIds=new Set((d.shows||[]).map(s=>s.tmdb_id)); }
  catch{ S.followedIds=new Set(); }
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Client-side mirror of search.rs parse_episode_markers (SxxExx / NxM /
// "season N episode M"). Returns "Season N Episode M" or "" — paints the
// interpreted episode into the loading skeleton instantly (booster; the
// server's d.searching is authoritative on the rendered card).
function seFromQuery(q){
  let m;
  if((m=q.match(/\bs(\d{1,3})e(\d{1,3})\b/i))
   ||(m=q.match(/\b(\d{1,3})x(\d{1,3})\b/i))
   ||(m=q.match(/\bseason\s+(\d{1,3})\s+(?:and\s+|,\s*)?episode\s+(\d{1,3})\b/i)))
    return `Season ${+m[1]} Episode ${+m[2]}`;
  return "";
}
