<!--
  web-remote SPA — Phase 3 (shell + grid + API client) + Phase 4 (search +
  hybrid play + target picker + now-playing + scrubber). Single no-build
  asset, served same-origin from /remote (mirrors /cast-receiver.html).
  Phase 5 (My Library view) + Phase 6 (in-browser phone playback) are not
  built yet; the nav/target entries for them are honest placeholders, not
  broken states (spec embarrassment criteria). Built against the verified
  live spela contracts (not the spec's assumed ones).
-->
<style>
  /* Manrope, embedded as a base64 variable WOFF2 (weight axis 200-800, one file
     covering every weight the UI uses: 500 body, 600-800 headers/nav/buttons).
     EMBEDDED, not merely named: Manrope is a third-party install present on the
     Mac but NOT on iOS, so a bare `font-family:Manrope` would silently fall back
     to the system face on the phone — which is where this UI is used in bed.
     Keeping it inline also preserves the single-self-contained-asset design (no
     network fetch, no FOUT, works offline). `font-display:block` avoids a flash
     of the fallback face on a cold load. Built from ~/Library/Fonts/Manrope[wght].ttf

  :root{
    color-scheme:dark;
    --bg:#0b0b0f; --bg2:#15151c; --bg3:#1f1f29; --line:#2a2a36;
    --fg:#e8e8ee; --dim:#8a8a99; --dim2:#5a5a6a;
    --accent:#5b8cff; --accent2:#3a64d8; --good:#37c87a; --warn:#e0a23a; --bad:#e0564a;
    --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:500 16px/1.5 "Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{display:flex;flex-direction:column;min-height:100%}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font:inherit}
  a{color:var(--accent);text-decoration:none}

  /* ---- top bar ---- */
  header{position:sticky;top:0;z-index:20;background:rgba(11,11,15,.92);
    backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line);
    padding:calc(.6rem + var(--safe-t)) .8rem .6rem;display:flex;align-items:center;gap:.6rem}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:1.15rem;color:var(--fg);cursor:pointer}
  .brand small{color:var(--dim2);font-weight:600;font-size:.7rem;margin-left:.3rem}
  nav{display:flex;gap:.15rem;margin-left:.4rem;background:var(--bg2);border-radius:999px;padding:.2rem}
  nav a{color:var(--dim);padding:.32rem .7rem;border-radius:999px;font-size:.85rem;font-weight:600}
  nav a.on{color:var(--fg);background:var(--bg3)}
  .tgt{margin-left:auto;display:flex;align-items:center;gap:.35rem;background:var(--bg2);
    border:1px solid var(--line);border-radius:999px;padding:.34rem .7rem;font-size:.82rem;max-width:46vw}
  .tgt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tgt .dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex:none}
  .tgt.set .dot{background:var(--good)}

  main{flex:1;padding:.8rem;padding-bottom:8rem}
  .view{display:none;animation:fade .18s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---- search ---- */
  /* 2026-07-13: search box + Movies/TV selector always on ONE line (row, no
     wrap) — input flexes to fill, selector keeps intrinsic width. Fits phone→
     desktop (input shrinks; selector never does). */
  .searchbar{display:flex;flex-direction:row;align-items:center;gap:.6rem;margin-bottom:1rem}
  .searchbar input{flex:1 1 auto;min-width:0;background:var(--bg2);border:1px solid var(--line);
    border-radius:var(--r);padding:.85rem 1rem;color:var(--fg)}
  .searchbar input:focus{outline:2px solid var(--accent2);outline-offset:0}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;
    padding:.2rem;flex:0 0 auto}
  .seg button{padding:.3rem .9rem;border-radius:999px;color:var(--dim);font-size:.84rem;font-weight:600}
  .seg button.on{background:var(--accent2);color:#fff}

  /* ---- poster grid / card ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem;
    content-visibility:auto;contain-intrinsic-size:auto 280px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;display:flex;flex-direction:column}
  .poster{position:relative;aspect-ratio:2/3;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
  .poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
  .poster img.in{opacity:1}
  .poster .shimmer{position:absolute;inset:0;background:linear-gradient(100deg,
    var(--bg2) 30%,var(--bg3) 50%,var(--bg2) 70%);background-size:200% 100%;
    animation:sh 1.2s linear infinite}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  .poster .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:.8rem;color:var(--dim);font-weight:700;font-size:.95rem}
  .meta{padding:.6rem .7rem}
  .meta .t{font-weight:700;font-size:.95rem;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* Season/episode tag inline with the title (e.g. "Fargo SEASON 1 EPISODE 1").
     60% of the title size + .7 opacity + uppercase so it reads as a recessive
     qualifier on the same line, not a competing heading. Only rendered when the
     query carried SxxExx (server -> d.searching). */
  .meta .t .se{font-size:60%;opacity:.7;text-transform:uppercase;font-weight:600;
    letter-spacing:.03em;margin-left:.5em;white-space:nowrap}
  .meta .y{color:var(--dim);font-size:.8rem;margin-top:.15rem}
  .card .play{margin:.55rem .7rem .7rem;background:var(--accent2);color:#fff;
    border-radius:10px;padding:.55rem;font-weight:700;font-size:.88rem;text-align:center}
  .card .play:active{transform:scale(.98)}
  .src-toggle{margin:0 .7rem .7rem;color:var(--accent);font-size:.8rem;font-weight:600;text-align:center}
  .sources{margin:0 .55rem .65rem;display:none;flex-direction:column;gap:.3rem}
  .sources.open{display:flex}
  .src{display:flex;gap:.5rem;align-items:center;background:var(--bg3);border:1px solid var(--line);
    border-radius:9px;padding:.5rem .6rem;font-size:.78rem}
  .src:active{border-color:var(--accent2)}
  .src .q{font-weight:700;color:var(--fg)}
  .src .x{color:var(--dim)}
  .src .s{margin-left:auto;color:var(--good);font-weight:700;white-space:nowrap}
  /* 2026-07-04: seed health — amber = low (may be slow), red = dead (likely
     won't start). Mirrors the green "on disk" style so slow sources are visible. */
  .src .s.low{color:var(--warn)}
  .src .s.dead{color:var(--bad)}
  .src .s.fresh{color:var(--accent)}  /* just-aired: swarm forming, count unreliable */
  .src.dead{border-color:var(--bad);background:linear-gradient(90deg,rgba(224,86,74,.13),var(--bg3))}
  /* 2026-06-30: a source already (part-)downloaded on disk — tapping it resumes
     (librqbit overwrite:true) instead of re-fetching that fraction. */
  .src.partial{border-color:var(--good);background:linear-gradient(90deg,rgba(55,200,122,.16),var(--bg3))}
  .src .dl{color:var(--good);font-weight:800;white-space:nowrap}
  .src-toggle.has-partial{color:var(--good)}
  /* 2026-07-13: "Continue watching" row (spela-native tracker, slice 1) */
  .recent{display:none;margin:.2rem 0 .4rem}
  .recent.on{display:block}
  .recent .rlab{color:var(--dim);font-size:.72rem;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;margin:.1rem .15rem .4rem}
  .recent .chips{display:flex;flex-wrap:wrap;gap:.5rem;padding-bottom:.3rem}
  .recent .chip{flex:0 0 auto;background:var(--bg3);border:1px solid var(--line);
    border-radius:11px;padding:.5rem .8rem;font-size:.82rem;font-weight:600;color:var(--fg);
    white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
  .recent .chip .ep{color:var(--dim);font-weight:500;margin-left:.35rem;font-size:.76rem}
  .recent .chip:active{border-color:var(--accent2);transform:scale(.97)}
  /* 2026-07-28: "New episodes" of followed series (slice 2b — TVTime replacement) */
  .following{display:none;margin:.2rem 0 .5rem}
  .following.on{display:block}
  .following .rlab{color:var(--dim);font-size:.72rem;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;margin:.1rem .15rem .4rem}
  .folist{display:flex;flex-direction:column;gap:.4rem}
  .foitem{display:flex;align-items:stretch;gap:.4rem}
  .fotap{flex:1 1 auto;text-align:left;background:var(--bg3);border:1px solid var(--line);
    border-radius:11px;padding:.55rem .75rem;display:flex;flex-direction:column;gap:.15rem;
    min-width:0;touch-action:manipulation}
  .fotap:active{border-color:var(--accent2);transform:scale(.99)}
  .fotitle{font-weight:700;font-size:.9rem;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fometa{font-size:.78rem;color:var(--dim)}
  .fometa b{color:var(--accent);font-weight:800}
  .fosub{font-size:.72rem;color:var(--dim2);margin-top:.03rem}
  .fotap{min-height:64px;justify-content:center}
  .cprog{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:.35rem;overflow:hidden}
  .cprogfill{display:block;height:100%;background:var(--accent);border-radius:2px}
  .foitem .ep{margin-left:.4rem;font-size:.72rem;color:var(--dim2);font-weight:600}
  .foitem .partway{color:var(--accent);font-weight:600}
  .fowrap{display:flex;flex-direction:column;gap:.3rem}
  .foseasonbtn{flex:0 0 auto;background:var(--bg3);border:1px solid var(--line);border-radius:.55rem;color:var(--dim);min-width:44px;font-size:1rem}
  .foseasonbtn:active{transform:scale(.96)}
  .foseasons{display:none;padding:.35rem .2rem .1rem}
  .foseasons.on{display:block}
  .foseaslab{font-size:.72rem;color:var(--dim2);margin-bottom:.3rem}
  .foseaschips{display:flex;flex-wrap:wrap;gap:.4rem}
  .foseaschip{background:var(--bg3);border:1px solid var(--line);border-radius:1rem;color:var(--dim);padding:.3rem .7rem;font-size:.8rem;min-height:34px}
  .foseaschip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .play.playicon{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:.55rem 1rem}
  .play.playicon .lu{width:1.4em;height:1.4em}
  .foplay{flex:0 0 auto;background:var(--accent);border:1px solid var(--accent);border-radius:.55rem;color:#fff;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .foplay .lu{width:1.25em;height:1.25em}
  .foplay:active{transform:scale(.96)}
  .fomark{flex:0 0 46px;border:1px solid var(--line);border-radius:11px;background:var(--bg3);
    color:var(--good);font-size:1.2rem;font-weight:800;touch-action:manipulation}
  .fomark:active{transform:scale(.95)}
  .fomark:disabled{opacity:.4}
  .founfollow{flex:0 0 40px;border:1px solid var(--line);border-radius:11px;background:var(--bg3);
    color:var(--dim);font-size:1.05rem;cursor:pointer;transition:transform .06s}
  .founfollow:active{transform:scale(.95)} .founfollow:disabled{opacity:.4}
  .newbadge{align-self:center;margin-left:.5rem;background:var(--accent2);color:#fff;font-size:.7rem;
    font-weight:800;border-radius:999px;padding:.15rem .5rem;white-space:nowrap;text-decoration:none;line-height:1.6}
  /* To-Watch section headers — small all-caps, x-aligned with row titles
     (padding-left matches .src row inner padding), equal vertical margins. */
  .twhead{color:var(--dim);font-size:.7rem;font-weight:800;letter-spacing:.09em;
    text-transform:uppercase;margin:.95rem 0;padding-left:.7rem}
  .twhead:first-child{margin-top:.25rem}
  /* 2026-07-13: To-Watch rows get a half-faded poster background + the release
     year after the title (both TMDB-fetched via /title-meta, lazy + cached). */
  /* Single-line rows: title truncates with ellipsis (it's what varies most),
     year/note/score stay fixed → every row is the same height, titles stay
     left-aligned (no wrap-induced centering). The grid cells are minmax(0,1fr)
     so the flex title can shrink below its content width. */
  #towatchOut .src{flex-wrap:nowrap;overflow:hidden}
  #towatchOut .src .q{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;text-align:left}
  #towatchOut .src .ty{flex:0 0 auto;white-space:nowrap;color:var(--dim);
    font-weight:600;font-size:.82rem;margin-left:.45rem}
  #towatchOut .src .x{flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
  #towatchOut .src .s{flex:0 0 auto}
  #towatchOut .src{transition:background-image .3s ease}
  /* 2026-07-14: list fills the viewport (was capped at .detail's 940px, leaving
     the right half empty), responsive columns, ~2% right margin. Extra fields
     (runtime/seasons + status) ride along, hidden on narrow phones where there's
     no room. */
  #towatchOut .detail{max-width:none;padding-right:2vw}
  /* On To-Watch, inset the New-Episodes section by .55rem to match the .sources
     box (series/movies rows) — rows align at .55rem, the label at .70rem (= .twhead
     padding-left). The search-landing .following keeps its full-width alignment. */
  #towatchOut .following{margin-left:.55rem;margin-right:.55rem}
  /* Fill the viewport at 2 columns max (wider viewport = wider rows, never
     narrower — 3 columns made cells narrower than 2-col-at-medium and starved
     the title). Each row is a query CONTAINER so the extras drop by the ROW's
     own width (below), keeping the title readable at any width. */
  #towatchOut .src{container-type:inline-size}
  #towatchOut .src .mx{flex:0 0 auto;white-space:nowrap;color:var(--dim);font-size:.8rem;margin-left:.45rem}
  #towatchOut .src .stx{flex:0 0 auto;white-space:nowrap;font-size:.68rem;font-weight:700;margin-left:.5rem;
    padding:.1rem .42rem;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
  #towatchOut .src .stx.on{color:var(--good);border-color:rgba(55,200,122,.5)}
  /* Drop the lower-priority extras as the ROW narrows (status → seasons →
     genre), so the title keeps its space instead of collapsing to "C". Year +
     RT score + title always stay. Row-width based (container query), so it's
     correct at any column width / viewport. */
  @container (max-width:1080px){ #towatchOut .src .mx,#towatchOut .src .stx{display:none} }
  @container (max-width:620px){ #towatchOut .src .gx{display:none} }
  /* 2026-07-13: "Mark watched" secondary button on the search detail card. */
  .markw{background:var(--bg3);border:1px solid var(--line);border-radius:12px;
    padding:.55rem 1rem;color:var(--fg);font-weight:700;font-size:.9rem;min-height:48px;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .markw:active{transform:scale(.97);border-color:var(--accent2)}
  .markw.done{color:var(--good);border-color:var(--good);background:rgba(55,200,122,.1)}
  .card .markw{margin:.5rem .7rem 0}
  .detail .body>.markw{margin:.6rem 0 0;max-width:260px}
  .followbtn{background:var(--bg3);border:1px solid var(--line);border-radius:12px;
    color:var(--fg);padding:.55rem .8rem;font-size:.9rem;cursor:pointer;transition:transform .06s,border-color .1s}
  .followbtn:active{transform:scale(.97)} .followbtn:disabled{opacity:.5}
  .followbtn.on{color:var(--good);border-color:var(--good);background:rgba(55,200,122,.1)}
  .epname{color:var(--dim);font-size:.9rem;margin-top:.15rem}
  .airinfo{color:var(--dim);font-size:.82rem;margin-top:.25rem;opacity:.8}
  .airs{color:var(--accent2);font-weight:600;font-size:.95rem;padding:.55rem 0}
  /* 2026-07-13: "Rotten Tomatoes →" read-more link on the search detail card.
     Uses RT's search URL (always lands on the title; hand-built /m/ slugs 404
     on disambiguated titles). Works for movies AND series, no key. */
  .rtlink{display:inline-flex;align-items:center;gap:.4rem;background:var(--bg3);
    border:1px solid var(--line);border-radius:12px;padding:.55rem 1rem;color:var(--fg);
    font-weight:700;font-size:.9rem;min-height:48px;touch-action:manipulation}
  .rtlink:active{transform:scale(.97);border-color:var(--accent2)}
  /* button row (Play · Mark-watched · RT-tomato-right); More-sources sits below.
     The compact "🍅 →" RT link is pushed to the right edge. */
  .actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .actions>*{margin:0!important}
  .card .actions{margin:.55rem .7rem 0}
  .detail .body>.actions{margin:.75rem 0 0}
  .actions .rtlink{margin-left:auto!important;padding:.55rem .8rem}
  .actions .play{max-width:none}
  /* metadata detail line on the search card: year-range · genres · runtime · ⭐ */
  .dline{color:var(--dim);font-size:.92rem;line-height:1.45}
  .card .dline{margin:.2rem .7rem 0}
  .detail .body>.dline{margin:.35rem 0 .1rem}
  /* 2026-07-13: Chromecast auto-track confirm prompt (slice 5). A house-TV
     session was detected as watched — but housemates use these TVs, so ASK
     before it enters Fredrik's ledger. */
  .pending{display:none;margin:.2rem 0 .6rem}
  .pending.on{display:block}
  .pending .rlab{color:var(--warn);font-size:.72rem;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;margin:.1rem .15rem .45rem}
  .pconf{display:flex;align-items:center;gap:.6rem;background:var(--bg2);
    border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:.5rem}
  .pconf .pt{flex:1;min-width:0}
  .pconf .pt .a{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pconf .pt .b{color:var(--dim);font-size:.76rem;margin-top:.1rem}
  .pconf .pb{display:flex;gap:.5rem;flex:0 0 auto}
  .pconf .yes,.pconf .no{border-radius:10px;padding:.55rem .9rem;font-weight:700;font-size:.86rem;
    min-height:44px;display:flex;align-items:center;touch-action:manipulation}
  .pconf .yes{background:var(--good);color:#04120a}
  .pconf .no{background:var(--bg3);border:1px solid var(--line);color:var(--fg)}
  .pconf .yes:active,.pconf .no:active{transform:scale(.95)}

  /* ---- search detail (single result): adaptive, fills the width intelligently.
     2026-07-13: search renders ONE card (show + nested sources), so the shared
     auto-fill poster grid collapsed it into one 150px left column on desktop
     (80% of the screen empty) while the phone media query forced full width —
     backwards. Give search its own layout: poster left + body right on wide,
     sources in two columns when there's room; stacked full-width on phones. */
  .detail{max-width:940px}
  @media (min-width:641px){
    .detail .card{display:grid;grid-template-columns:210px 1fr;align-items:start;
      padding:.9rem;column-gap:1.2rem}
    .detail .card>.poster{width:210px;border-radius:12px;overflow:hidden;align-self:start}
    .detail .card>.body{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
    .detail .body>.meta{padding:0}
    .detail .body>.meta .t{font-size:1.2rem;-webkit-line-clamp:3}
    .detail .body>.play{margin:.75rem 0 0;max-width:260px}
    .detail .body>.src-toggle{text-align:left;margin:.65rem 0 0}
    .detail .body>.sources{margin:.5rem 0 0;align-self:stretch}
    .detail .sources.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
    .detail .src{font-size:.84rem}
  }

  /* ---- states ---- */
  .state{padding:3rem 1rem;text-align:center;color:var(--dim)}
  .libbar{display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:.82rem;margin:.1rem .15rem .7rem}
  .srcbtn{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:.45rem .9rem;color:var(--fg);font-weight:700;font-size:.85rem}
  .srcbtn:active{border-color:var(--accent2)}
  .state .big{font-size:1.05rem;color:var(--fg);font-weight:700;margin-bottom:.3rem}
  .skeleton .card .shimmer{display:block}
  .banner{position:sticky;top:0;z-index:30;background:var(--bad);color:#fff;
    padding:.6rem .9rem;display:none;align-items:center;gap:.6rem;font-size:.85rem;font-weight:600}
  .banner.on{display:flex}
  .banner button{margin-left:auto;background:rgba(255,255,255,.2);border-radius:8px;padding:.3rem .7rem;font-weight:700}
  .toast{position:fixed;left:50%;bottom:calc(8.5rem + var(--safe-b));transform:translateX(-50%);
    background:var(--bg3);border:1px solid var(--line);color:var(--fg);padding:.7rem 1rem;
    border-radius:12px;font-size:.85rem;max-width:90vw;z-index:40;opacity:0;pointer-events:none;
    transition:opacity .2s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast.on{opacity:1}

  /* ---- now-playing bar + full view ---- */
  #nowbar{position:fixed;left:0;right:0;bottom:0;z-index:25;
    background:rgba(21,21,28,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:.55rem .7rem calc(.55rem + var(--safe-b));display:none;gap:.6rem;align-items:center}
  #nowbar.on{display:flex}
  #nowbar .mp{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--bg3);flex:none}
  #nowbar .nt{flex:1;min-width:0}
  #nowbar .nt .a{font-weight:700;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #nowbar .nt .b{color:var(--dim);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbtn{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:flex;
    align-items:center;justify-content:center;font-size:1rem;flex:none}
  /* 2026-07-04: crisp <100ms tap feedback (NN/g 0.1s "feels instant" rule) —
     a clear press = color + scale-down, springs back on release. */
  .tbtn{transition:transform .08s ease, background .12s ease}
  .tbtn:active{background:var(--accent2);transform:scale(.88)}
  .tbtn.big{width:54px;height:54px;font-size:1.3rem;background:var(--accent2);color:#fff}
  .tbtn.big:active{transform:scale(.92);filter:brightness(1.15)}
  #nowbar.fading{opacity:.28;transition:opacity .28s ease}
  .nowfull{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1rem .5rem}
  .nowfull .bigposter{width:min(62vw,260px);aspect-ratio:2/3;border-radius:18px;object-fit:cover;
    background:var(--bg3);box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .phvid{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  /* 2026-07-04: live warmup progress (#warmup, all transcoded plays) + the
     phone-direct buffering overlay (#phbuf) over the <video> until first frame. */
  .phwrap{position:relative;width:min(94vw,640px);align-self:center}
  .phbuf{position:absolute;inset:0;justify-content:center;background:rgba(11,11,15,.78);border-radius:14px}
  .wbar{width:min(360px,80%);height:10px;border-radius:6px;background:var(--bg3);overflow:hidden;margin:.1rem 0}
  .wfill{height:100%;background:var(--warn);border-radius:6px;transition:width .45s ease}
  .nowfull h2{margin:.2rem 0 0;font-size:1.3rem;text-align:center}
  .nowfull .sub{color:var(--dim);font-size:.85rem;margin-top:-.4rem}
  .nowfull .epline{color:var(--fg);font-size:1rem;font-weight:600;margin-top:.15rem;opacity:.92}
  .lu{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.16em;flex:none;stroke:currentColor}
  nav a .lu,.seg button .lu{margin-right:.34em}
  .tgt .lu{margin-right:.4em}
  .topt .ic .lu{width:1.3em;height:1.3em;vertical-align:-.2em}
  .srcbtn .lu{margin-right:.35em}
  .scrub{width:min(92vw,420px)}
  .scrub .rail{position:relative;height:6px;border-radius:3px;background:var(--bg3);overflow:hidden}
  .scrub .frontier{position:absolute;inset:0 0 0 0;background:var(--line)}
  .scrub .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
  .scrub input{width:100%;margin:.4rem 0 0;accent-color:var(--accent);background:transparent}
  .scrub .times{display:flex;justify-content:space-between;color:var(--dim);font-size:.76rem;margin-top:.1rem}
  .transport{display:flex;gap:.7rem;align-items:center;justify-content:center;margin-top:.3rem}
  .starting{display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--warn);
    font-weight:700;padding:1rem}
  .spin{width:26px;height:26px;border:3px solid var(--bg3);border-top-color:var(--warn);
    border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ---- lower-third loading panel (2026-08-04): the warmup + VLC-buffer + play-error
     surfaces as a bottom-third overlay over the current view (search/home stay
     visible), NOT a fullscreen #/now takeover. Slides up when active. ---- */
  #warmpanel{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bg2);
    border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    box-shadow:0 -14px 44px rgba(0,0,0,.55);padding:1rem 1rem calc(1rem + var(--safe-b));
    transform:translateY(115%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:42vh;overflow:hidden}
  #warmpanel.on{transform:none}
  .wp{display:flex;gap:.9rem;align-items:stretch}
  .wpthumb{flex:0 0 auto;width:78px;aspect-ratio:2/3;border-radius:11px;object-fit:cover;
    background:var(--bg3);box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .wpbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:.5rem;justify-content:center}
  .wptitle{font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wpphase{display:flex;align-items:center;gap:.55rem;color:var(--warn);font-weight:700;font-size:.92rem}
  .wpphase .spin{width:18px;height:18px;border-width:2px}
  .wp .wbar{width:100%;margin:.05rem 0}
  .wpsub{color:var(--dim);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wpact{display:flex;gap:.6rem;margin-top:.15rem;flex-wrap:wrap}
  .wperr .wpphase{color:var(--bad)}
  .srcbtn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}

  /* ---- target sheet ---- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);
    border-radius:18px 18px 0 0;border-top:1px solid var(--line);
    padding:1rem 1rem calc(1.2rem + var(--safe-b));transform:translateY(100%);
    transition:transform .22s ease;max-height:80vh;overflow:auto}
  .sheet.on{transform:none}
  .sheet h3{margin:.1rem 0 .8rem;font-size:1rem}
  .topt{display:flex;align-items:center;gap:.7rem;width:100%;background:var(--bg3);
    border:1px solid var(--line);border-radius:12px;padding:.85rem;margin-bottom:.5rem;text-align:left}
  .topt[disabled]{opacity:.5}
  .topt .ic{font-size:1.1rem}
  .topt .nm{font-weight:700}
  .topt .md{color:var(--dim);font-size:.76rem}
  .topt.sel{border-color:var(--accent);background:var(--accent2)}
  .topt .tag{margin-left:auto;font-size:.68rem;color:var(--dim2);border:1px solid var(--line);
    border-radius:6px;padding:.1rem .35rem}

  /* ===== Movie-night touch overrides (2026-05-18) =====================
     Research-backed: WCAG 2.5.5 AAA / Apple HIG = 44px min; this is a
     dim-room one-handed phone remote, so primary targets go WELL beyond
     (Fitts's law: bigger + spaced + edge-anchored = faster, fewer
     mistaps). Appended → later-cascade wins, original design intact,
     behaviour unchanged. touch-action:manipulation kills the 300ms tap
     delay + double-tap-zoom (snappier); inputs stay >=16px (no iOS
     focus-zoom); strong :active since touchless = no hover. */
  button,a,input,.card,.src,.topt,[role=button]{touch-action:manipulation}
  /* Base 17px (Fredrik's pick, 2026-08-26 — 16px was tried and reverted). From the 2026-05-18
     touch-target overhaul; the primary hit areas (nav 46px, search input 56px,
     target pill 44px, row buttons 40px) are px-anchored, not rem, so they are
     unaffected — only rem-based padding scales by 16/17. Inputs stay >=16px, so
     iOS still won't focus-zoom. */
  html,body{font-size:17px}
  nav{gap:.25rem;padding:.28rem}
  nav a{min-height:46px;display:flex;align-items:center;padding:.55rem 1.05rem;font-size:1rem}
  /* Nav tabs adopt the section-header voice (CONTINUE / NEW EPISODES / COMING
     SOON) — same all-caps + weight + tracking as `.twhead`, one step larger so
     the nav still reads as the primary level. Must sit AFTER the base `nav a`
     rules to win the cascade. 2026-08-26. */
  nav a{font-size:.82rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    white-space:nowrap}  /* uppercase+tracking widened the labels — TO WATCH wrapped to two lines in a narrow window */
  .seg button{min-height:46px;display:flex;align-items:center;padding:.5rem 1.15rem;font-size:1rem}
  .searchbar input{min-height:56px;font-size:1.05rem;padding:1rem 1.1rem}
  .tgt{min-height:44px;font-size:.92rem;padding:.5rem .8rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1rem}
  .card .play{min-height:56px;display:flex;align-items:center;justify-content:center;
    margin:.6rem .7rem .75rem;font-size:1.02rem;border-radius:12px}
  .card .play:active{transform:scale(.97);background:var(--accent)}
  .src-toggle{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:.92rem}
  .src{min-height:56px;font-size:.9rem;padding:.7rem .8rem;gap:.7rem}
  .src:active{transform:scale(.985);border-color:var(--accent)}
  .srcbtn{min-height:48px;font-size:.95rem;padding:.6rem 1.1rem}
  .meta .t{font-size:1.02rem}
  .meta .y{font-size:.86rem}
  #nowbar{padding:.7rem .8rem calc(.7rem + var(--safe-b));gap:.7rem}
  #nowbar .mp{width:52px;height:52px}
  #nowbar .nt .a{font-size:.98rem}
  #nowbar .nt .b{font-size:.82rem}
  .tbtn{width:60px;height:60px;font-size:1.5rem}
  .tbtn:active{transform:scale(.92);background:var(--accent)}
  .tbtn.big{width:88px;height:88px;font-size:2.1rem}
  .scrub{width:min(94vw,460px)}
  .scrub .rail{height:12px;border-radius:6px}
  .scrub input{min-height:48px;margin:.1rem 0 0}
  .scrub .times{font-size:.9rem;margin-top:.35rem}
  .transport{gap:1.1rem;margin-top:.6rem}
  .nowfull h2{font-size:1.5rem}
  .nowfull .bigposter{width:min(68vw,300px)}
  .topt{min-height:64px;padding:1rem;font-size:1rem}

  /* Persistent play-start error surface (2026-07-08, UX doc §6/§9) */
  .errbox{display:flex;flex-direction:column;align-items:center;gap:1rem;width:min(92vw,460px)}
  .errmsg{color:var(--warn);font-size:.98rem;text-align:center;line-height:1.45;
    background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:.9rem 1.1rem}
  .errbox .transport{flex-wrap:wrap}
  .srcbtn.primary{background:var(--accent2);color:#fff;border-color:transparent}
  .srcbtn.primary:active{background:var(--accent)}

  /* ===== Narrow-viewport (phone) layout fixes (2026-07-08) ==============
     Symptoms (Fredrik's phone screenshots): the header (brand + labelled
     nav pills + device pill) was wider than the viewport → the whole page
     scrolled sideways into dead black space; and a single search result sat
     in one ~168px grid column = ~half width. Fix: icon-only nav + device
     pill (labels recognizable by icon; active tab still shows via `.on`
     background), drop the "remote" sub-brand, single-column full-width
     search results, and a hard belt against any residual sideways scroll.
     Scoped to phones so desktop keeps labels + the multi-column grid. */
  /* Show status + intel line (2026-08-27). The pill is quiet by design — it informs a
     decision, it is not a call to action, so it must not compete with the play button. */
  .stpill{display:inline-block;margin-left:.5rem;padding:.1rem .5rem;border-radius:999px;
    font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    vertical-align:middle;border:1px solid transparent}
  .stpill.good{background:rgba(80,200,120,.14);color:#7fd6a0;border-color:rgba(80,200,120,.28)}
  .stpill.warn{background:rgba(230,180,60,.14);color:#e3bd6a;border-color:rgba(230,180,60,.30)}
  .stpill.done{background:rgba(160,160,175,.13);color:#a9a9b8;border-color:rgba(160,160,175,.26)}
  .stpill.bad{background:rgba(225,90,90,.14);color:#e58a8a;border-color:rgba(225,90,90,.30)}
  .shownote{margin-top:.35rem;font-size:.85rem;line-height:1.4;color:var(--dim,#9a9aa8);
    max-width:62ch}
  .shownote.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden}
  .shownote .noteage{opacity:.62;font-size:.8em}
  .notemore{margin-top:.15rem;padding:0;background:none;border:0;cursor:pointer;
    color:var(--accent);font-size:.8rem;font-weight:600}

  /* Now-view goes two-column on a wide viewport (2026-08-27). The single centred
     column was built for a phone; on a desktop it leaves most of the width empty and
     pushes the transport controls below the fold — the screenshot that prompted this had
     the poster scrolled out of frame above the title.

     Scoped with :has(.bigposter) so it applies ONLY to the poster variant. The
     phone-direct variant reuses .nowfull with a <video> in place of the poster, where a
     side-by-side split would be wrong. A browser without :has simply keeps the single
     column, which is the current design rather than a broken one. */
  @media (min-width:900px){
    /* Poster left, everything else in ONE stacked column beside it. The first attempt
       made each child its own grid row spanning the poster's height, so the title floated
       mid-air while the scrubber sank to the bottom — the space was filled, but by gaps.
       A single wrapper (.nowmeta) is what actually makes a column. */
    .nowfull:has(.bigposter){
      display:flex; align-items:center; justify-content:center;
      gap:2.6rem; padding:2rem 2rem; max-width:1200px; margin:0 auto;
    }
    .nowfull:has(.bigposter) .bigposter{width:min(28vw,320px); flex:0 0 auto}
    .nowfull:has(.bigposter) .nowmeta{
      flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
      align-items:stretch; gap:.85rem; text-align:left;
    }
    /* The title carries the page at this size; it was competing with the poster before. */
    .nowfull:has(.bigposter) .nowmeta h2{font-size:2.4rem; line-height:1.1; margin:0; text-align:left}
    .nowfull:has(.bigposter) .nowmeta .epline{font-size:1.15rem; text-align:left; margin:0}
    .nowfull:has(.bigposter) .nowmeta .sub{text-align:left; margin:0}
    /* Full-width scrubber is the point of the extra room. */
    .nowfull:has(.bigposter) .nowmeta .scrub{width:100%; margin:.4rem 0 .2rem}
    /* Transport sits under the scrubber it controls, left-aligned with the text. */
    .nowfull:has(.bigposter) .nowmeta .transport{justify-content:flex-start; margin:.2rem 0 0}
    .nowfull:has(.bigposter) .nowmeta .starting{justify-content:flex-start}
  }


  @media (max-width:560px){
    .brand small{display:none}               /* drop " remote" — saves width */
    nav a .lbl{display:none}                 /* icon-only tabs */
    nav a{padding:.55rem .78rem}             /* compact square-ish pills */
    nav a .lu{margin-right:0}                /* no trailing gap w/ label gone */
    #tgtLabel{display:none}                  /* Chromecast pill = icon only */
    .tgt{max-width:none;padding:.5rem .72rem}
    .tgt .lu{margin-right:0}
    #v-search .grid{grid-template-columns:1fr}  /* full-width search result + sources */
  }
  /* Belt: nothing may create a sideways scroll (the header used to). `clip`
     (not `hidden`) so it doesn't become a scroll container / break the
     sticky header. The header now fits on its own; this just guarantees it. */
  html{overflow-x:clip}
  header{max-width:100%}
  .topt .ic{font-size:1.5rem}
  .topt .nm{font-size:1.02rem}
  .state{padding:3.5rem 1rem;font-size:1.02rem}
  .state .big{font-size:1.25rem}
  .starting{font-size:1.05rem}
  .spin{width:34px;height:34px}
  .banner{min-height:52px;font-size:.95rem}
  .banner button{min-height:40px;padding:.45rem 1rem}
  main{padding-bottom:9rem}
  /* Toast with an inline action (the ✓ Undo). The action must be a real
     touch target, so the toast grows a flex row rather than staying text-only. */
  .toast{display:flex;align-items:center;gap:.85rem}
  .toast button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:.55rem;
    font:inherit;font-weight:600;padding:.4rem .9rem;min-height:38px;cursor:pointer}
  .toast button:active{background:rgba(255,255,255,.3)}
  /* "Watched" section on To-Watch — the hidden set, made visible so a mis-mark is
     fixable. Dimmer than a live row: it is an archive, not a candidate. */
  .twwatched{opacity:.62}
  .twwatched .src{padding-right:3.4rem}
  /* `.src` is authored as a DIRECT child of the `.sources` GRID, so wrapping it
     in `.wrow` (needed to anchor the ✕) handed the grid column to the wrapper and
     left the button shrink-to-fit at ~73px, collapsing the title span to zero
     width — rows rendered as a bare tomato + ✕ with no text. The wrapper must
     therefore pass its full column width through. 2026-08-27. */
  .wrow{position:relative;display:block;width:100%}
  .wrow>.src{width:100%}
  .wrow .unmark{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
    background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:.5rem;
    font-size:1rem;line-height:1;min-width:40px;min-height:40px;cursor:pointer}
  .wrow .unmark:active{background:rgba(255,255,255,.26)}
  /* A Library card IS the play control (posterCard `clickPlays`) — give it the
     pointer and a visible keyboard focus ring, since a role=button div gets
     neither for free. 2026-08-26. */
  /* Trailer: a click-to-load FACADE, never an eager iframe. A YouTube embed pulls
     megabytes of third-party JS and sets cookies; doing that on every search result —
     on a phone, in bed — would undo the viewport-gated enrichment work. The facade is
     YouTube's own still (i.ytimg.com), so it costs one image until tapped, and the
     player is only inserted on click. nocookie host + no autoplay-until-asked. */
  .trbtn{display:flex;align-items:center;gap:.55rem;background:var(--bg2);
    border:1px solid var(--line);border-radius:.7rem;padding:.5rem .9rem;
    min-height:44px;font-weight:700;font-size:.9rem;cursor:pointer}
  .trwrap{margin-top:.85rem;border-radius:.8rem;overflow:hidden;background:#000;
    position:relative;aspect-ratio:16/9;max-width:640px}
  .trwrap img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72}
  .trwrap .trplay{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;border:0;background:transparent;cursor:pointer}
  .trwrap .trplay span{width:68px;height:48px;border-radius:.8rem;
    background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:1.6rem;line-height:1}
  .trwrap .trplay:active span{background:rgba(0,0,0,.85)}
  .trwrap iframe{width:100%;height:100%;border:0;display:block}
  /* Rewatch rows: SPACIOUS + ALWAYS-SYMMETRIC. The crammed, ragged look came from
     variable-length metadata wrapping differently in each half-width grid cell, so
     rows never lined up. Two fixes, in order of effect: drop the metadata that
     earns nothing here, and give every row the same height regardless of content.
     GENRE is dropped outright — Fredrik has already SEEN these, so genre tells him
     nothing he does not know; it was also the longest and most wrap-prone field.
     What remains is what a rewatch decision actually needs: the title, the year,
     how long it will take, and the score. */
  /* FIXED height, not min-height: a floor still lets a long title wrap and push its
     row taller than its neighbour, which is the raggedness itself (measured 64/70/91/113
     px across the shelf). The title clamps to two lines instead, so "Terminator 3: Rise
     of the Machines" and "Moon" occupy identical boxes. Two lines rather than one keeps
     long titles readable instead of ellipsing them into ambiguity. */
  /* padding-right is EXPLICIT, not left to the lower-specificity `.rwrow>.src` rule:
     this selector is id+class so it wins, and writing `padding` as a SHORTHAND here
     silently reset the right inset to .9rem — which let the score box run under the
     rating buttons on 23 of 80 rows (worst overlap 34px). The reserve must clear the
     button cluster (81px wide, offset 8.5px from the edge). */
  #v-rewatch .src{height:72px;padding:.7rem 6.2rem .7rem .9rem;gap:.65rem;
    align-items:center;overflow:hidden}
  /* TWO LINES, not one crowded row: title on its own line, metadata beneath. Sharing
     one horizontal line made the title and the metadata compete for width, and on
     SERIES rows the metadata wins (year-range + seasons + episodes + status are all
     nowrap), squeezing "Rick and Morty" into three wrapped lines inside a 72px box.
     Giving the title the full width and letting the rest flow underneath is also the
     shape of the To-Watch rows this view was asked to resemble. */
  /* .src is a <button>, whose UA default is text-align:center. Invisible while the
     title was an auto-width flex item; the full-width two-line restack exposed it. */
  #v-rewatch .src{flex-wrap:wrap;align-content:center;row-gap:.2rem;text-align:left}
  #v-rewatch .q{flex:0 0 100%;font-size:.95rem;font-weight:700;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #v-rewatch .gx{display:none}                 /* genre: already known */
  #v-rewatch .ty,#v-rewatch .mx,#v-rewatch .stx{font-size:.74rem;color:var(--dim);
    white-space:nowrap;font-weight:600}
  #v-rewatch .s{font-size:.8rem}
  #v-rewatch .sources.open{gap:.55rem}
  /* Rating on a Rewatch row: two toggles, not a cycle. Unrated is the honest
     default and is simply "neither pressed" — a cycling control would force the
     reader to remember which state a glyph currently means. */
  .rate{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
    display:flex;gap:.3rem}
  .rate button{background:rgba(255,255,255,.08);border:0;border-radius:.5rem;
    min-width:38px;min-height:38px;color:var(--dim);font-size:.95rem;cursor:pointer}
  .rate button.on{background:rgba(255,255,255,.2);color:var(--fg)}
  .rate button.love.on{background:rgba(255,90,120,.28);color:#ff9db0}
  .rate button:active{background:rgba(255,255,255,.3)}
  .rwrow{position:relative;display:block;width:100%}
  .rwrow>.src{width:100%;padding-right:6.2rem}
  #v-rewatch .rwrow{height:72px}
  .lovedonly{margin-left:auto;font-size:.72rem;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;background:var(--bg2);border:1px solid var(--line);
    border-radius:999px;padding:.4rem .8rem;min-height:36px;color:var(--dim);cursor:pointer}
  .lovedonly.on{background:rgba(255,90,120,.22);color:#ff9db0;border-color:transparent}
  .packn{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;margin-top:.15rem}
  .cardplay{cursor:pointer}
  .cardplay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* ---- Hover gleam -------------------------------------------------------
     Ported from brf-auto's dashboard queue-card refresh swoosh
     (`~/Projects/brf-auto/frontend/src/index.css` → `.queue-card-swoosh`):
     a 120deg white gradient translating -120% → 120% over 1.1s ease-out.
     Two deliberate changes for spela:
       (1) INTENSITY. The source peaks at rgba(255,255,255,.7), calibrated for
           a light CREAM card. Over this near-black chrome (#1f1f29 items) that
           same value reads as a camera flash, so the peak is re-scaled — see
           --gleam-peak. One knob, tune it there and every surface follows.
       (2) TRIGGER. brf-auto fires it once on a data refresh; here it fires on
           HOVER and then SETTLES into a persistent inset glow. The settle uses
           a transition-delay set ONLY on the :hover state, so the glow arrives
           after the sweep has passed but disappears immediately on pointer-out
           (a delay on the base rule would make the glow linger after leaving).
     The rim never brightens: an inset shadow paints INSIDE the border box, so
     each element keeps its own border colour.
     Pointer-only. iOS leaves :hover stuck after a tap, which would strand the
     glow on the last-tapped row; touch already has the :active feedback from
     the 2026-05-18 touch-target pass. */
  :root{--gleam-peak:.18;--gleam-rest:.15}
  @media (hover:hover){
    .fotap,.src,.card,
    .foplay,.fomark,.founfollow,.foseasonbtn,.unmark,.playicon,.srcbtn,
    .tgt,.tbtn,.topt,.newbadge,nav a,.seg button,.toast button,.banner button,
    .markw,.followbtn,.rtlink,.src-toggle{
      position:relative;overflow:hidden;transition:box-shadow .25s ease}
    .fotap::after,.src::after,.card::after,
    .foplay::after,.fomark::after,.founfollow::after,.foseasonbtn::after,
    .unmark::after,.playicon::after,.srcbtn::after,
    .tgt::after,.tbtn::after,.topt::after,.newbadge::after,nav a::after,
    .seg button::after,.toast button::after,.banner button::after,
    .markw::after,.followbtn::after,.rtlink::after,.src-toggle::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      border-radius:inherit;transform:translateX(-120%);
      background:linear-gradient(120deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,var(--gleam-peak)) 45%,
        rgba(255,255,255,0) 100%)}
    .fotap:hover::after,.src:hover::after,.card:hover::after,
    .foplay:hover::after,.fomark:hover::after,.founfollow:hover::after,
    .foseasonbtn:hover::after,.unmark:hover::after,.playicon:hover::after,
    .srcbtn:hover::after,.tgt:hover::after,.tbtn:hover::after,.topt:hover::after,
    .newbadge:hover::after,nav a:hover::after,.seg button:hover::after,
    .toast button:hover::after,.banner button:hover::after,
    .markw:hover::after,.followbtn:hover::after,.rtlink:hover::after,
    .src-toggle:hover::after{
      animation:spelaGleam 1.1s ease-out forwards}
    .fotap:hover,.src:hover,.card:hover,
    .foplay:hover,.fomark:hover,.founfollow:hover,.foseasonbtn:hover,
    .unmark:hover,.playicon:hover,.srcbtn:hover,.tgt:hover,.tbtn:hover,
    .topt:hover,.newbadge:hover,nav a:hover,.seg button:hover,
    .toast button:hover,.banner button:hover,
    .markw:hover,.followbtn:hover,.rtlink:hover,.src-toggle:hover{
      box-shadow:inset 0 0 14px rgba(255,255,255,var(--gleam-rest));
      /* Rises across the WHOLE sweep (1.1s, no delay) rather than arriving as
         the gleam exits — Fredrik 2026-08-26. Release stays quick: the .25s
         from the base rule applies on pointer-out. */
      transition:box-shadow 1.1s ease}
    /* The search view usually holds ONE result, so the card IS the page —
       gleaming the whole thing on any pointer move is noise, not an affordance.
       Its inner controls keep the effect. Scoped to #v-search so the LIBRARY
       grid (same .card class, many cards) is unaffected. Fredrik 2026-08-26. */
    #v-search .card{overflow:visible;transition:none}
    #v-search .card::after{content:none}
    #v-search .card:hover{box-shadow:none}
  }
  @keyframes spelaGleam{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  /* Reduced motion: the global rule above already collapses the sweep to .01ms
     (invisible). Drop the settle DELAY too, so the glow is plain instant hover
     feedback rather than appearing abruptly half a second late. */
  @media (prefers-reduced-motion:reduce){
    .fotap:hover,.src:hover,.card:hover,.foplay:hover,.fomark:hover,
    .founfollow:hover,.foseasonbtn:hover,.unmark:hover,.playicon:hover,
    .srcbtn:hover,.tgt:hover,.tbtn:hover,.topt:hover,.newbadge:hover,
    nav a:hover,.seg button:hover,.toast button:hover,.banner button:hover{
      transition-delay:0s!important}
  }
</style>
</head>
<body>

<script type="module">
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,p={})=>Object.assign(document.createElement(t),p);
// Route TMDB CDN posters through spela's self-hosted proxy+cache (/poster/...)
// so they're served from the LAN after the first view, not image.tmdb.org.
// Non-TMDB / already-local URLs pass through unchanged.
const posterSrc=u=>{ if(!u) return u;
  const m=/^https?:\/\/image\.tmdb\.org\/t\/p\/(.+)$/.exec(u); return m?"/poster/"+m[1]:u; };
const fmt=s=>{ s=Math.max(0,Math.round(s||0)); const h=s/3600|0,m=(s%3600)/60|0,x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); };

/* ---------- state ---------- */
const TKEY="spela_target", MKEY="spela_mode";
const S={
  target:JSON.parse(sessionStorage.getItem(TKEY)||"null")||{kind:"vlc",name:"VLC"},   // {kind:'chromecast'|'phone'|'vlc'|'shannon', name}; default VLC — the Mac monitor is the main watch surface. Switch via the target chip; the pick lasts the session.
  mode:sessionStorage.getItem(MKEY)||"movie",                 // 'movie' | 'tv'
  search:{q:"",abort:null,data:null},
  library:{data:null,loading:false},
  now:{data:null,posAbs:0,dur:0,frontier:0,endlist:false,playing:false,lastSync:0,
       everRan:false,cold:false,seekDrag:false,phone:false,
       warming:false,warmup:null,warmupData:null,   // 2026-07-04 live warmup progress
       vlc:false,vlcTitle:"",   // 2026-08-04 VLC-on-this-Mac remote-control now-view
       epLabel:"",epShort:"",   // 2026-08-06 which episode is playing ("S04E03 · Human Best Friend" / "S04E03")
       error:null},   // 2026-07-08 persistent play-start failure {title,poster,msg,retry}
  pollTimer:null, frontierTimer:null, warmTimer:null, vlcTimer:null,
  pending:null,   // deferred play: tapped before a target was set → picker → resume
  followedIds:null   // Set<tmdb_id> of followed shows; lazily loaded (ensureFollowedIds)
};

/* ---------- API client (abortable; network err -> banner) ---------- */
let reachable=true;
function setBanner(on,msg){ const b=$("#banner"); if(msg)$("#bannerMsg").textContent=msg;
  b.classList.toggle("on",on); }
async function api(path,{method="GET",body,signal}={}){
  try{
    const r=await fetch(path,{method,signal,
      headers:body?{"Content-Type":"application/json"}:undefined,
      body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));
    if(!reachable){reachable=true;setBanner(false);}
    return j;
  }catch(e){
    if(e.name==="AbortError") throw e;
    reachable=false; setBanner(true,"spela unreachable");
    throw e;
  }
}
$("#bannerRetry").onclick=()=>{ setBanner(false); route(); pollNow(true); };

let toastT;
// Open a source directly in VLC (native HEVC/Dolby-Vision decode, full seek, no
// HLS/browser transcode). Baseline: download a one-line .m3u that the OS hands
// to VLC. If a vlc:// protocol handler is installed (smoothest, true one-click),
// S.vlcScheme is set and we fire that instead. 2026-07-13.
// Poll /vlc/{id}/ready until the source can open in VLC without hanging (complete
// file → instant; partial torrent → when the head/tail Cues are primed + a buffer
// cushion exists). Returns true when ready, false if the user gave up / it errored.
// Progress via a re-fired toast (stays visible); a complete file returns on poll 0.
async function vlcWaitReady(id, gen){
  for(let i=0;i<600;i++){   // ~15 min cap at 1.5s/poll
    if(gen!=null && S.vlcGen!==gen) return "superseded";  // a newer VLC source took over — stop this loop silently
    let d; try{ d=await api("/vlc/"+id+"/ready"); }catch(e){ S.now.vlcErr="spela unreachable"; return false; }
    if(gen!=null && S.vlcGen!==gen) return "superseded";  // re-check after the await
    if(d && d.error){ S.now.vlcErr=d.error; return false; }
    if(d && d.ready) return true;
    // A source with no reachable peers will NEVER become ready, so waiting on it is
    // waiting on nothing. Rotate to the next ranked source, exactly as handle_play's
    // auto-retry loop does on the Chromecast path — the VLC path never had an
    // equivalent, and since the play button always takes result #1, one dead top pick
    // was an unresolvable spinner (The Diplomat S03E01, 2026-08-27).
    if(d && d.dead) return {rotate:true};
    // The server raced the top candidates and a different one is actually delivering.
    // Switch to it rather than keep waiting on a source that is losing.
    if(d && d.switch_to) return {switchTo:d.switch_to};
    // Drive the loading surface (not a transient toast) — matches the Chromecast warmup.
    S.now.warmup={active:true, vlc:true, pct:(d&&d.pct!=null)?d.pct:0};
    if(S.now.warming) renderWarmPanel();
    await new Promise(r=>setTimeout(r,1500));
  }
  S.now.vlcErr="Still buffering — the swarm may be slow."; return false;
}
async function openInVlc(id,title,poster){
  // Single active VLC buffer: bump a generation token so any PRIOR openInVlc's
  // readiness-poll loop supersedes itself (2026-08-05). Without this, tapping several
  // sources ran concurrent /vlc/ready poll loops, each buffering its own torrent —
  // wasteful, and (pre server-fix) it fed a mutual start↔stop reap death spiral.
  const gen = S.vlcGen = (S.vlcGen||0)+1;
  // 2026-08-04: fall back to the search show's poster when the caller didn't thread
  // one (a VLC play always follows a search, so show.poster_url is available) — /status
  // for a VLC stream carries no poster, so an empty arg → a broken now-view <img>.
  poster = poster || (S.search.data && S.search.data.show && S.search.data.show.poster_url) || "";
  // Immediate loading surface (like the Chromecast warmup), THEN wait until spela
  // says the source is ready (head/tail Cues primed) before firing VLC — so a fresh
  // torrent never opens to a hung player, and the user always sees progress.
  beginWarming(title||"Opening in VLC…", poster); stopWarmupPoll();  // /progress isn't the VLC source; vlcWaitReady drives the screen
  S.now.vlcErr=null;
  let rdy = await vlcWaitReady(id, gen);
  // Rotate past dead sources. Bounded, and each skip is ANNOUNCED rather than silent:
  // a play that quietly switches source is indistinguishable from one that ignored the
  // pick. Matches the Chromecast retry budget of three.
  let skipped = 0;
  const total = (S.search.data && S.search.data.results && S.search.data.results.length) || 0;
  while(rdy && (rdy.rotate || rdy.switchTo) && skipped < 3){
    if(rdy.switchTo){
      // Not a failure — the race found a source that is actually delivering.
      S.now.vlcNote = "Source " + rdy.switchTo + " is downloading faster — switching…";
      id = rdy.switchTo;
    }else{
      if(id + 1 > total) break;
      id += 1;
      S.now.vlcNote = "Source " + (id-1) + " had no peers — trying source " + id + "…";
    }
    skipped += 1;
    if(S.now.warming) renderWarmPanel();
    rdy = await vlcWaitReady(id, gen);
  }
  if(rdy && (rdy.rotate || rdy.switchTo)){ S.now.vlcErr="No source for this episode had reachable peers."; rdy=false; }
  S.now.vlcNote=null;
  if(rdy==="superseded") return;   // a newer VLC source took over this screen — don't clobber it with an error
  if(rdy!==true){
    showPlayError(title||"VLC", poster, S.now.vlcErr||"Couldn’t buffer this source.", ()=>openInVlc(id,title,poster)); return;
  }
  let m3u;
  try{ const r=await fetch("/vlc/"+id+"/open.m3u"); if(!r.ok){ showPlayError(title||"VLC",poster,"Couldn’t resolve that source.",()=>openInVlc(id,title,poster)); return; } m3u=await r.text(); }
  catch(e){ showPlayError(title||"VLC",poster,"spela unreachable",()=>openInVlc(id,title,poster)); return; }
  const url=(m3u.split("\n").find(l=>l.startsWith("http"))||"").trim();
  if(!url){ showPlayError(title||"VLC",poster,"No stream URL.",()=>openInVlc(id,title,poster)); return; }
  endWarming();
  // 2026-08-04: VLC-on-this-Mac becomes a controllable now-view (parity with
  // Chromecast). The Mac-side spela-vlc-bridge relays pause/resume/seek from the
  // web remote to VLC's HTTP interface; its /position POST feeds the scrubber.
  S.now.vlc=true; S.now.phone=false; S.now.cold=false; S.now.playing=true; S.now.error=null;
  S.now.endlist=true; S.now.frontier=0; S.now.posAbs=0; S.now.dur=0;
  S.now.lastSync=Date.now(); S.now.vlcTitle="";
  S.now.data={title:title||"VLC",poster_url:poster||"",quality:"",target:":VLC",imdb_id:"",ss_offset:0};
  stopPolling();   // the Chromecast /status poll must NOT run for a VLC stream
  location.hash="#/now"; renderNowFull(); startVlcPoll();
  toast("Opening in VLC…");
  // Fire the PLAYLIST url (…/open.m3u), NOT the bare stream url. VLC opening the .m3u
  // is what makes its #EXTVLCOPT lines apply — the subtitle input-slave, resume
  // start-time, buffer. Firing the extracted stream url (the old behavior) meant VLC
  // opened the bare stream and DISCARDED every EXTVLCOPT → no subs, no resume
  // (2026-08-08). Keep ?al= on it for the vlc:// handler's --audio-language. Handler
  // is installed on the Mac (install-vlc-url-handler.sh + Chrome AutoLaunch); no
  // page-navigation fallback (it double-opened in browser+VLC on multi-monitor, 2026-08-05).
  const m3uUrl=url.replace(/\/stream\?/,"/open.m3u?");
  window.location.href=m3uUrl.replace(/^https?:\/\//,"vlc://");
}
// Library file → VLC. The file is COMPLETE on the origin, so there's no torrent
// buffering to poll: resolve its serve-library URL (/library/vlc.m3u) and fire vlc://
// straight away. Shares the VLC now-view + bridge-relay control with openInVlc; the
// generation token supersedes any prior VLC buffer the same way.
async function openLibraryInVlc(spec){
  const gen=S.vlcGen=(S.vlcGen||0)+1;
  const title=spec.label||"VLC", poster=spec.poster||"", q=encodeURIComponent(spec.body.title);
  // A pack chooser pick rides along as `file`, so the origin serves the EXACT
  // episode instead of re-running its title matcher inside the directory.
  const fq=spec.libraryFile?"&file="+encodeURIComponent(spec.libraryFile):"";
  beginWarming(title,poster); stopWarmupPoll();
  let m3u;
  try{ const r=await fetch("/library/vlc.m3u?title="+q+fq);
    if(!r.ok){ const j=await r.json().catch(()=>({})); showPlayError(title,poster,j.error||"Couldn’t resolve that library file.",()=>openLibraryInVlc(spec)); return; }
    m3u=await r.text();
  }catch(e){ showPlayError(title,poster,"spela unreachable",()=>openLibraryInVlc(spec)); return; }
  if(gen!==S.vlcGen) return;                 // a newer VLC source took over
  const url=(m3u.split("\n").find(l=>l.startsWith("http"))||"").trim();
  if(!url){ showPlayError(title,poster,"No stream URL.",()=>openLibraryInVlc(spec)); return; }
  endWarming();
  S.now.vlc=true; S.now.phone=false; S.now.cold=false; S.now.playing=true; S.now.error=null;
  S.now.endlist=true; S.now.frontier=0; S.now.posAbs=0; S.now.dur=0;
  S.now.lastSync=Date.now(); S.now.vlcTitle="";
  S.now.data={title:title,poster_url:poster,quality:"",target:":VLC",imdb_id:"",ss_offset:0};
  stopPolling();
  location.hash="#/now"; renderNowFull(); startVlcPoll();
  toast("Opening in VLC…");
  // vlc:// only — no page-navigation fallback (see openInVlc: the blur-timeout fallback
  // double-opened in browser + VLC on a multi-monitor setup where VLC doesn't blur Chrome).
  window.location.href=url.replace(/^https?:\/\//,"vlc://");
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),4200); }
// Toast carrying one action button — used for Undo after a ✓ mark-watched. Held
// longer than a plain toast (an undo you can't reach in time isn't an undo).
function toastAction(msg,label,fn){ const t=$("#toast"); t.textContent=msg;
  const b=el("button",{textContent:label});
  b.onclick=()=>{ clearTimeout(toastT); t.classList.remove("on"); fn(); };
  t.appendChild(b); t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),9000); }

/* ---------- router ---------- */
// Kill any playing trailer. A YouTube iframe keeps playing audio after its view is
// hidden — hash routing only toggles `.view.on`, it does not unmount anything — so a
// trailer started on the search card carried on playing over every other page until
// the tab was closed. Removing the ELEMENT is the only reliable stop: postMessage to
// the player needs the iframe API, and pause-on-hidden would not survive a re-render.
// Called from route() so no view can leak one, and before a new search replaces the
// card underneath it. 2026-08-27.
function stopTrailers(){
  document.querySelectorAll(".trwrap iframe").forEach(f=>{
    f.src="about:blank";           // halt the stream even if removal is deferred
    f.remove();
  });
  // Put the facade back so the card is not left with an empty black box.
  document.querySelectorAll(".trwrap").forEach(w=>{ if(!w.children.length) w.remove(); });
}
function route(){
  stopTrailers();
  const v=(location.hash.replace(/^#\//,"")||"home").split("?")[0];
  const known=["home","search","library","now","towatch","rewatch"].includes(v)?v:"home";
  $$(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+known));
  $$("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===known));
  if(known==="home") loadHome();
  if(known==="now") renderNowFull();
  if(known==="library") renderLibrary();
  if(known==="search" && !S.search.q){ loadRecent(); }
  if(known==="towatch") renderToWatch();
  if(known==="rewatch") renderRewatch();
}

// "To Watch" view — the recommender's to-watch list (slice 3 arsenal), from
// /watchlist (seeded from the RT import; curated by the Claude harness). Series
// + movies as tappable rows (RT critic score shown); already-watched are hidden.
// Tap → search that title. 2026-07-13.
async function renderToWatch(){
  const out=$("#towatchOut"); if(!out) return;
  out.innerHTML=`<div class="state">Loading…</div>`;
  let d; try{ d=await api("/watchlist"); }catch(e){ out.innerHTML=`<div class="state"><div class="big">spela unreachable</div></div>`; return; }
  const mk=(arr,isTV)=>(arr||[]).filter(x=>!x.watched).map(x=>{
    const r=el("button",{className:"src"});
    r.appendChild(el("span",{className:"q",textContent:x.title}));
    // year + real TMDB genre are filled in by enrichToWatchRow (the old hand-
    // written `note` was inconsistent + jargon-y, replaced by real genres).
    if(x.rt!=null) r.appendChild(el("span",{className:"s "+(x.rt>=88?"":"low"),textContent:"🍅 "+x.rt}));
    r.onclick=()=>{ setMode(isTV?"tv":"movie"); const q=searchQueryFor(x);
      $("#q").value=q; S.search.q=q; location.hash="#/search"; runSearch(q); };
    enrichWhenVisible(r,()=>enrichToWatchRow(r,x,isTV));
    return r;
  });
  const series=mk(d.series,true), movies=mk(d.movies,false);
  out.innerHTML="";
  const wrap=el("div",{className:"detail"});
  // New episodes of followed shows at the top — same section as the search landing.
  try{ const fd=await api("/following"); const fc=el("div",{className:"following"});
    if(fillFollowing(fc,(fd&&fd.shows)||[],refreshFollowing)>0){ fc.classList.add("on"); wrap.appendChild(fc); }
  }catch{}
  // Claude-curated recommendations — the smart, ranked top of your to-watch pool.
  // Lives here (not the landing): it IS the to-watch list, just curated.
  try{ const rd=await api("/recommendations"); const rc=el("div",{className:"following"});
    fillRecommended(rc,(rd&&rd.picks)||[]); if(rc.classList.contains("on")) wrap.appendChild(rc);
  }catch{}
  if(series.length){ wrap.appendChild(el("div",{className:"twhead",textContent:`Series · ${series.length}`}));
    const box=el("div",{className:"sources open"}); series.forEach(r=>box.appendChild(r)); wrap.appendChild(box); }
  if(movies.length){ wrap.appendChild(el("div",{className:"twhead",textContent:`Movies · ${movies.length}`}));
    const box=el("div",{className:"sources open"}); movies.forEach(r=>box.appendChild(r)); wrap.appendChild(box); }
  if(!series.length&&!movies.length) wrap.appendChild(el("div",{className:"state",textContent:"To-watch list is empty."}));
  // The Watched archive moved to its own #/rewatch view (2026-08-27); keeping a
  // second copy here made To-Watch a list of both what he has not seen AND what he
  // has, which is two different questions on one page.
  out.appendChild(wrap);
}

// Write a rating to the ledger. null clears. Failure leaves the button unchanged
// rather than showing a state the server does not hold.
async function rateTitle(title,rating){
  try{ const r=await api("/watched-rate",{method:"POST",body:{title,rating}});
    if(r&&r.ok) return true; toast("Couldn't save that rating"); return false; }
  catch{ toast("spela unreachable"); return false; }
}
// Loved-only is a VIEW filter, not a separate fetch — the shelf is already in the DOM,
// so hiding is instant and toggling back costs nothing.
let _lovedOnly=false;
function applyLovedFilter(){
  document.querySelectorAll("#v-rewatch .rwrow").forEach(h=>{
    const it=h.__item;
    h.style.display = (_lovedOnly && !(it&&it.rating===1)) ? "none" : "";
  });
  document.querySelectorAll("#v-rewatch .twhead").forEach(hd=>{
    const box=hd.nextElementSibling;
    if(!box||!box.classList.contains("sources")) return;
    const vis=[...box.children].filter(c=>c.style.display!=="none").length;
    hd.style.display = vis ? "" : "none";
    box.style.display = vis ? "" : "none";
  });
}

// Rewatch — the watch-ledger as a browsable shelf. Seen is NOT ineligible: Fredrik is
// openly rewatch-willing (both the Matrix and Terminator runs, "would gladly rewatch some
// of the later ones"), and `has_seen` answers "is this a discovery?", never "would he
// watch it tonight?". So the exclusion that is correct for RECOMMENDATIONS is wrong here,
// and this view deliberately reads the same ledger from the other side. Newest-watched
// first, since a recent finish is the likeliest rewatch prompt. 2026-08-27.
async function renderRewatch(){
  const out=$("#rewatchOut"); if(!out) return;
  out.innerHTML=`<div class="state">Loading…</div>`;
  let d; try{ d=await api("/watched"); }
  catch{ out.innerHTML=`<div class="state"><div class="big">spela unreachable</div></div>`; return; }
  // The ledger holds one row per EPISODE; collapse to the show/film so the shelf
  // lists titles rather than 9 rows of Widow's Bay. Ledger order is newest-first.
  const seen=new Set(), items=[];
  ((d&&d.watched)||[]).forEach(w=>{
    const name=w.show||w.title; if(!name||seen.has(name)) return;
    // An `SxxExx` in the ledger title PROVES tv. Its absence proves nothing — a show
    // marked at show level looks identical to a film here — so that case asks the
    // server to resolve (knownTV=null => media_type=auto).
    // Three tiers of evidence, best first: the server's CACHED media type (stable
    // forever, so this is fact); an SxxExx in the ledger title (proves tv); nothing
    // (ask the server to resolve — its ABSENCE proves nothing, since a show marked
    // at show level looks exactly like a film here).
    const provenTV = /S\d\dE\d\d/i.test(w.title||"");
    const cachedTV = w.media_type ? w.media_type==="tv" : null;
    const known = cachedTV!==null ? cachedTV : (provenTV ? true : null);
    seen.add(name); items.push({title:name, imdb_id:w.imdb_id||null,
      rating: (w.rating===undefined?null:w.rating),
      knownTV: known, resolvedTV: known===true, settled: known!==null});
  });
  if(!items.length){ out.innerHTML=`<div class="state"><div class="big">Nothing watched yet</div>Finish something and it shows up here.</div>`; return; }
  out.innerHTML=""; _lovedOnly=false;
  const wrap=el("div",{className:"detail"});
  // Rows are built once and MOVED into their section as the server resolves each
  // media type. Splitting Films from Series matters more here than on To-Watch: the
  // decision "what do I rewatch tonight" is mostly a runtime decision, and a 2h film
  // and a 5-season show are not comparable choices sitting in one list.
  const mk=(x)=>{
    const holder=el("div",{className:"rwrow"});
    const r=el("button",{className:"src"});
    r.appendChild(el("span",{className:"q",textContent:x.title}));
    r.onclick=()=>{ setMode(x.resolvedTV?"tv":"movie"); const q=searchQueryFor(x);
      $("#q").value=q; S.search.q=q; location.hash="#/search"; runSearch(q); };
    // Two toggles: loved and not-for-me. Neither pressed = unrated, which is the
    // honest default; pressing one clears the other, since they are exclusive.
    const rate=el("div",{className:"rate"});
    const mkBtn=(cls,glyph,val,label)=>{
      const b=el("button",{className:cls,textContent:glyph,title:label});
      b.setAttribute("aria-label",label+" "+x.title);
      if(x.rating===val) b.classList.add("on");
      b.onclick=async(ev)=>{ ev.stopPropagation();
        const next = b.classList.contains("on") ? null : val;   // pressing again clears
        b.disabled=true;
        const ok=await rateTitle(x.title,next);
        b.disabled=false;
        if(!ok) return;
        x.rating=next;
        rate.querySelectorAll("button").forEach(o=>o.classList.remove("on"));
        if(next!==null) b.classList.add("on");
        applyLovedFilter();
      };
      return b;
    };
    rate.append(mkBtn("love","♥",1,"Loved"), mkBtn("nope","✕",-1,"Not for me"));
    holder.append(r,rate);
    enrichWhenVisible(r,async()=>{
      await enrichToWatchRow(r,x,x.knownTV);
      const dest = x.resolvedTV ? seriesBox : filmBox;
      if(holder.parentElement!==dest){ dest.appendChild(holder); bump(); }
    });
    holder.__item=x;
    return holder;
  };
  const bar=el("div",{className:"libbar"});
  bar.appendChild(el("span",{textContent:`${items.length} watched`}));
  const loved=el("button",{className:"lovedonly",textContent:"♥ Loved only"});
  loved.onclick=()=>{ _lovedOnly=!_lovedOnly; loved.classList.toggle("on",_lovedOnly);
    applyLovedFilter(); };
  bar.appendChild(loved);
  wrap.appendChild(bar);
  const filmHead=el("div",{className:"twhead",textContent:"Films"});
  const filmBox=el("div",{className:"sources open"});
  const seriesHead=el("div",{className:"twhead",textContent:"Series"});
  const seriesBox=el("div",{className:"sources open"});
  const pendHead=el("div",{className:"twhead",textContent:`Watched · ${items.length} · tap to play again`});
  const pendBox=el("div",{className:"sources open"});
  function bump(){
    const f=filmBox.children.length, se=seriesBox.children.length, p=pendBox.children.length;
    filmHead.textContent=`Films · ${f}`;   filmHead.style.display=f?"":"none";
    filmBox.style.display=f?"":"none";
    seriesHead.textContent=`Series · ${se}`; seriesHead.style.display=se?"":"none";
    seriesBox.style.display=se?"":"none";
    pendHead.style.display=p?"":"none";     pendBox.style.display=p?"":"none";
    pendHead.textContent=`Not yet identified · ${p}`;
  }
  items.forEach(x=>{
    const row=mk(x);
    // Known type => final section immediately. Only genuinely-unknown titles wait,
    // and they are labelled honestly rather than as "resolving".
    if(x.settled) (x.resolvedTV?seriesBox:filmBox).appendChild(row);
    else pendBox.appendChild(row);
  });
  wrap.append(filmHead,filmBox,seriesHead,seriesBox,pendHead,pendBox);
  out.appendChild(wrap); bump();
}

// Trailer facade. Renders YouTube's own still with a play glyph; the actual player
// iframe is only created on click, so a search costs one image rather than a full
// third-party player. Uses youtube-nocookie and asks for autoplay ONLY on the click
// (which is a user gesture, so the browser permits it). 2026-08-27.
function trailerBlock(key,title){
  const wrap=el("div",{className:"trwrap"});
  const img=el("img",{loading:"lazy",decoding:"async",alt:("Trailer for "+(title||"")).trim()});
  img.src=`https://i.ytimg.com/vi/${encodeURIComponent(key)}/hqdefault.jpg`;
  const btn=el("button",{className:"trplay"});
  btn.setAttribute("aria-label","Play trailer"+(title?" for "+title:""));
  btn.appendChild(el("span",{textContent:"▶"}));
  btn.onclick=()=>{
    const f=el("iframe");
    f.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(key)}?autoplay=1&rel=0`;
    f.setAttribute("allow","accelerometer; autoplay; encrypted-media; picture-in-picture");
    f.setAttribute("allowfullscreen","");
    f.setAttribute("title",("Trailer for "+(title||"")).trim());
    wrap.innerHTML=""; wrap.appendChild(f);
  };
  wrap.append(img,btn);
  return wrap;
}

// A row that taps through to search ALREADY KNOWS the year — pass it, do not throw it
// away. Without a year the shared scorer falls back on vote count, so a brand-new title
// loses to an established same-named one: "Furious" resolved to a 2017 Russian battle
// film (165 votes) instead of the 2026 FBI series (59 votes), and the card showed a
// medieval poster. `extract_year_from_query` server-side strips a trailing year and
// passes it as &first_air_date_year / &year, which disambiguates exactly this case.
// Same lesson as the ID-first title resolution: identity the caller holds must travel
// with the request. 2026-08-27.
function searchQueryFor(item){
  const t=(item&&item.title)||"";
  // year may be a range ("2026–present") after enrichment — take the first 4 digits.
  const y=String((item&&item.year)||"").match(/\d{4}/);
  return y ? `${t} ${y[0]}` : t;
}

// Lazy enrichment. Every list row used to fire its /title-meta immediately, so
// opening To-Watch queued 143 requests (61 to-watch + 82 recommendations) through
// the browser's ~6-connection limit — individually fast (median 260ms, server-cached)
// but ~1.3s to settle, which is the delay Fredrik felt. Rows now enrich only as they
// approach the viewport, so first paint costs the handful actually on screen.
// 2026-08-27.
const _enrichObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries,obs)=>{
      entries.forEach(e=>{
        if(!e.isIntersecting) return;
        obs.unobserve(e.target);
        const fn=e.target.__enrich; if(fn){ e.target.__enrich=null; fn(); }
      });
    }, {rootMargin:"300px 0px"})   // start slightly before it scrolls in
  : null;
function enrichWhenVisible(el, fn){
  if(!_enrichObserver){ fn(); return; }   // no observer support → old behaviour
  el.__enrich=fn; _enrichObserver.observe(el);
}

// Lazily enrich a To-Watch row with its poster (as a half-faded background) and
// release year (after the title) — TMDB via /title-meta, cached server-side so
// it's one lookup per title then instant. Progressive: rows show immediately,
// posters/years fill in as they resolve. 2026-07-13.
// Build a /title-meta query that passes the ids/year the item already carries, so
// resolution is ID-FIRST (mismatch-proof) instead of fuzzy-title. Without this the
// server can only guess by title and picks a same-named wrong-year/wrong-media title
// (e.g. "The Curse" → the 1999 movie instead of the 2023 series). 2026-08-21.
function titleMetaQS(it,isTV){
  // isTV===null => "I don't know": ask the server to resolve the media type rather
  // than let the typed search default to `movie` and return a different title.
  let qs="/title-meta?title="+encodeURIComponent(it.title||"")
        +(isTV===null?"&media_type=auto":(isTV?"&tv=1":""));
  if(it.tmdb_id) qs+="&tmdb_id="+encodeURIComponent(it.tmdb_id);
  if(it.imdb_id) qs+="&imdb_id="+encodeURIComponent(it.imdb_id);
  if(it.year)    qs+="&year="+encodeURIComponent(it.year);
  return qs;
}
async function enrichToWatchRow(row,x,isTV){
  let m; try{ m=await api(titleMetaQS(x,isTV)); }catch{ return; }
  if(!m) return;
  // The server reports what it actually RESOLVED. When we asked it to auto-detect we
  // must label from that, not from our guess — otherwise a series gets a film's
  // runtime (Station Eleven: "2013 · 85 min" for the 2021 limited series).
  if(m.media_type) isTV = m.media_type === "tv";
  // Write the resolved identity back onto the item, not only into the DOM: a row that
  // taps through to search reads it from here, and a bare title lets the shared scorer
  // fall back on vote count (see searchQueryFor).
  if(x){ x.resolvedTV = isTV;
         if(m.year && !x.year) x.year = m.year;
         if(m.imdb_id && !x.imdb_id) x.imdb_id = m.imdb_id; }
  const q=row.querySelector(".q");
  // live RT (MDBList) overrides the static curated score when present; also
  // gives a score to entries that had none.
  if(m.rt!=null){ let s=row.querySelector(".s"); if(!s){ s=el("span",{className:"s"}); row.appendChild(s); }
    s.textContent="🍅 "+m.rt; s.className="s "+(m.rt>=88?"":"low"); }
  if(m.year && q && !row.querySelector(".ty")) q.after(el("span",{className:"ty",textContent:String(m.year)}));
  if(m.genres && m.genres.length && !row.querySelector(".gx")){
    const g=el("span",{className:"x gx",textContent:m.genres.slice(0,2).join(", ")});
    (row.querySelector(".ty")||q).after(g);
  }
  if(!row.querySelector(".mx")){
    let extra="";
    // A limited series or a one-season show is better described by its EPISODE count
    // than by "1 season", which tells you nothing about the commitment.
    if(isTV && m.seasons>1) extra=m.seasons+" seasons"+(m.episodes?` · ${m.episodes} eps`:"");
    else if(isTV && m.episodes) extra=m.episodes+" episode"+(m.episodes>1?"s":"");
    else if(isTV && m.seasons) extra=m.seasons+" season";
    else if(m.runtime) extra=fmtRuntime(m.runtime);
    if(extra){ const ex=el("span",{className:"mx",textContent:extra});
      (row.querySelector(".gx")||row.querySelector(".ty")||q).after(ex); }
  }
  if(isTV && m.status && !row.querySelector(".stx")){

      (row.querySelector(".mx")||row.querySelector(".gx")||row.querySelector(".ty")||q).after(sx); }
  }
  const bgsrc=m.backdrop_url||m.poster_url;
  if(bgsrc){ const ps=posterSrc(bgsrc); const img=new Image();
    img.onload=()=>{ row.style.backgroundImage=`linear-gradient(90deg,rgba(15,15,20,.88),rgba(15,15,20,.62)),url('${ps}')`;
      row.style.backgroundSize="cover"; row.style.backgroundPosition=m.backdrop_url?"center 30%":"center 20%"; };
    img.src=ps; }
}
