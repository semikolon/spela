[package]
name = "spela"
version = "3.22.0"
edition = "2021"
description = "AI-agent-ready media controller — search, stream, cast"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
rust_cast = "0.21"
mdns-sd = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"   # Europe/Stockholm DST-correct tz for TVmaze airstamp -> local air-date
tower-http = { version = "0.6", features = ["cors"] }
dirs = "6"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
# Aug 4, 2026: systemd socket-activation support — inherit the listening socket
# across restarts so a redeploy doesn't drop live streams (graceful restart).
listenfd = "1"

# Apr 29, 2026: pure-Rust BitTorrent client to replace webtorrent-cli (Node).
# Migration plan: see `~/Projects/spela/CLAUDE.md` § "webtorrent-cli weak peer
# discovery" hard-won lesson. Pin 8.1.x — 9.0-beta has macOS build issues
# (rqbit issue #578) and edition-2024 Rust requirement. The streaming API
# (`ManagedTorrent::stream` -> `FileStream: AsyncRead + AsyncSeek`) is stable
# across 8.1 -> 9.0-beta.2, so the eventual upgrade is non-breaking.
# 2026-09-09: our own fork, pinned to a commit, for ONE upstream fix — the incoming
# listener starved itself. `task_tcp_listener` matched `Some(Ok(..)) = futs.next()`, a
# refutable pattern, and a failed handshake check is the COMMON case here (a peer asking
# for an infohash we deleted at teardown). Every failure disabled the drain branch for
# the rest of that select! call while accept() kept adding, so accepted sockets piled up
# unread until the process ran out of descriptors — measured ~990/min, reaching 13,600.
# Fix matches on `Some(res)` with an explicit Err arm, the shape the persistence loop in
# the same file already uses, and selects `biased` so checks in hand finish first.
# Branch: semikolon/rqbit fix-incoming-listener-starvation. PR upstream pending.
librqbit = { git = "https://github.com/semikolon/rqbit", rev = "1a354e6c7e51f097aafe8c73a9b2bb4da16010c3", default-features = false, features = ["rust-tls"] }

# Apr 30, 2026: rustls 0.23+ requires an explicit `CryptoProvider::install_default()`
# call before any TLS use when multiple provider crates can coexist transitively.
# librqbit's `rust-tls` feature pulls in rustls via reqwest/rustls-tls without
# pinning a provider. Without this dep + an early `install_default()` call in
# main.rs, librqbit's tracker / UPnP HTTPS path panics with:
#   "Could not automatically determine the process-level CryptoProvider from
#    Rustls crate features."
# The panic poisons whatever mutex the panicking task was holding, cascading
# into PoisonError on every subsequent `.lock().unwrap()`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# May 7, 2026: explicit dep for `parse_episode_markers` in src/search.rs and
# `is_running_state` regex helpers. Already pulled in transitively (librqbit,
# tracing-subscriber etc.), so adding it direct doesn't grow the tree.
regex = "1"
once_cell = "1"
libc = "0.2.189"

[dev-dependencies]
# mtime manipulation for disk-prune regression tests (Apr 15, 2026)
filetime = "0.2"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
opt-level = "z"
